<!DOCTYPE html>
<html>
<head>
  <title>Test Firebase</title>
</head>
<body>

<h2>Firebase Test</h2>

<input id="name" placeholder="name">
<input id="email" placeholder="email">
<input id="message" placeholder="message">

<button onclick="send()">Send</button>

<p id="status"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7PRz9K6IMr3foH5xsaVwmRTFJUlpv1Sg",
  authDomain: "vinctec-admin.firebaseapp.com",
  databaseURL: "https://vinctec-admin-default-rtdb.firebaseio.com",
  projectId: "vinctec-admin",
  storageBucket: "vinctec-admin.firebasestorage.app",
  messagingSenderId: "714000687361",
  appId: "1:714000687361:web:db2cc5745df0cb91b9bb00"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.send = function () {
  push(ref(db, "feedback"), {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    message: document.getElementById("message").value,
    time: Date.now()
  }).then(() => {
    document.getElementById("status").innerText = "SUCCESS";
  }).catch((e) => {
    document.getElementById("status").innerText = e.message;
  });
};
</script>

</body>
</html>
