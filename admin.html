<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.header {
  padding: 20px;
  text-align: center;
  background: #111827;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1f2937;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}

.card.unread {
  box-shadow: 0 0 0 2px #22c55e;
}

small {
  color: #9ca3af;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  background: red;
  color: white;
  cursor: pointer;
  margin-top: 10px;
  margin-right: 5px;
}

button:hover {
  opacity: 0.9;
}

.reply-btn {
  background: #2563eb;
}

.pin-btn {
  background: #ca8a04;
}

.read-btn {
  background: #16a34a;
}

.status-select, .followup-input {
  padding: 8px;
  border: none;
  border-radius: 6px;
  margin-top: 10px;
  margin-right: 5px;
}

#toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #22c55e;
  color: white;
  padding: 12px 16px;
  border-radius: 8px;
  display: none;
  z-index: 9999;
}

#replyBox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 9998;
  align-items: center;
  justify-content: center;
}

.reply-card {
  background: #1f2937;
  padding: 20px;
  border-radius: 12px;
  width: 90%;
  max-width: 500px;
}

.reply-card input,
.reply-card textarea,
.tool-box input,
.tool-box textarea {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: none;
  border-radius: 8px;
  box-sizing: border-box;
}

.reply-card textarea,
.tool-box textarea {
  height: 140px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin: 15px 0;
}

.stat-box, .tool-box {
  background: #1f2937;
  border-radius: 10px;
  padding: 15px;
}

.stat-number {
  font-size: 28px;
  font-weight: bold;
  color: #0ff;
}

.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 15px;
  margin: 15px 0;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 999px;
  background: #334155;
  color: #fff;
  font-size: 12px;
  margin-top: 6px;
}

.badge-unread { background: #16a34a; }
.badge-status { background: #2563eb; }
.badge-follow { background: #9333ea; }
</style>
</head>

<body>

<audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" preload="auto"></audio>

<div id="toast">New message received 🔔</div>

<div id="replyBox">
  <div class="reply-card">
    <h3>📧 Reply to Customer</h3>

    <input id="replyTo" readonly>
    <input id="replyName" readonly>

    <textarea id="replyMessage" placeholder="Type your reply here..."></textarea>

    <button class="pin-btn" onclick="generateAIReply()">✨ Generate AI Reply</button>
    <button class="reply-btn" onclick="sendReply()">Send Email</button>
    <button onclick="closeReply()">Cancel</button>

    <p id="emailStatus"></p>
  </div>
</div>

<div class="header">
  <h2>🔒 Admin Dashboard</h2>
  <p id="status">Checking login...</p>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

  <input id="search" type="text"
    placeholder="Search messages..."
    style="padding:10px;width:100%;border-radius:8px;border:none;margin-bottom:10px;box-sizing:border-box;">

  <div id="counter" style="margin-bottom:10px;color:#0ff;"></div>

  <div class="stats-grid">
    <div class="stat-box"><div class="stat-number" id="statTotal">0</div><div>Total Messages</div></div>
    <div class="stat-box"><div class="stat-number" id="statUnread">0</div><div>Unread</div></div>
    <div class="stat-box"><div class="stat-number" id="statLeads">0</div><div>Active Leads</div></div>
    <div class="stat-box"><div class="stat-number" id="statClients">0</div><div>Clients</div></div>
    <div class="stat-box"><div class="stat-number" id="statConversion">0%</div><div>Conversion Rate</div></div>
  </div>

  <div class="tool-grid">
    <div class="tool-box">
      <h3>✨ AI Business Outreach</h3>
      <input id="companyName" placeholder="Company name">
      <input id="companyType" placeholder="Business type, e.g. barber, restaurant, builder">
      <button class="reply-btn" onclick="generateOutreach()">Generate Outreach Email</button>
      <textarea id="outreachOutput" placeholder="Generated outreach email will appear here..."></textarea>
    </div>

    <div class="tool-box">
      <h3>🔍 AI Website Scanner</h3>
      <input id="auditBusiness" placeholder="Business name, e.g. Harlow Barber Shop">
      <input id="auditType" placeholder="Business type, e.g. barber, restaurant, builder">
      <input id="auditWebsite" placeholder="Paste business website URL">
      <button class="reply-btn" onclick="generateAudit()">Generate Website Audit</button>
      <button class="pin-btn" onclick="copyAudit()">Copy Audit</button>
      <textarea id="auditOutput" placeholder="Website audit report will appear here..."></textarea>
    </div>

    <div class="tool-box">
      <h3>🧱 AI Website Builder</h3>
      <input id="siteBusiness" placeholder="Business name, e.g. Fresh Cuts Barbers">
      <input id="siteType" placeholder="Business type, e.g. barber, restaurant, builder">
      <input id="siteColours" placeholder="Colours, e.g. black, gold, white">
      <input id="siteFeatures" placeholder="Features, e.g. booking, gallery, prices, contact form">
      <button class="reply-btn" onclick="generateWebsiteStarter()">Generate Website Starter</button>
      <button class="pin-btn" onclick="copyWebsiteStarter()">Copy Website Code</button>
      <textarea id="websiteBuilderOutput" placeholder="Generated website starter code will appear here..."></textarea>
    </div>
  </div>

  <h3>📥 Messages</h3>
  <div id="messages"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
import { getDatabase, ref, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

emailjs.init({
  publicKey: "gNIrD27eCoUVVUR0B"
});

const EMAILJS_SERVICE_ID = "service_omro2oc";
const EMAILJS_TEMPLATE_ID = "template_249t7dk";

const firebaseConfig = {
  apiKey: "AIzaSyB7PRz9K6IMr3foH5xsaVwmRTFJUlpv1Sg",
  authDomain: "vinctec-admin.firebaseapp.com",
  databaseURL: "https://vinctec-admin-default-rtdb.firebaseio.com",
  projectId: "vinctec-admin",
  storageBucket: "vinctec-admin.firebasestorage.app",
  messagingSenderId: "714000687361",
  appId: "1:714000687361:web:db2cc5745df0cb91b9bb00"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const allowedEmail = "obiwuru010@gmail.com";

const status = document.getElementById("status");
const messagesDiv = document.getElementById("messages");
const searchInput = document.getElementById("search");

let allMessages = {};
let lastCount = 0;
let currentReplyKey = null;

function showToast() {
  const toast = document.getElementById("toast");
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 3000);
}

function cleanStatus(value) {
  return value || "New Lead";
}

function updateStats() {
  const messages = Object.values(allMessages);
  const total = messages.length;
  const unread = messages.filter(m => !m.read).length;
  const clients = messages.filter(m => cleanStatus(m.status) === "Client").length;
  const activeLeads = messages.filter(m => cleanStatus(m.status) !== "Client").length;
  const conversion = total ? Math.round((clients / total) * 100) : 0;

  document.getElementById("statTotal").innerText = total;
  document.getElementById("statUnread").innerText = unread;
  document.getElementById("statLeads").innerText = activeLeads;
  document.getElementById("statClients").innerText = clients;
  document.getElementById("statConversion").innerText = conversion + "%";
  document.getElementById("counter").innerText = "Total Messages: " + total;
}

onAuthStateChanged(auth, (user) => {
  if (user && user.email === allowedEmail) {
    status.innerText = "Logged in as: " + user.email;
    loadMessages();
  } else {
    window.location.href = "login.html";
  }
});

function loadMessages() {
  const feedbackRef = ref(db, "feedback");

  onValue(feedbackRef, (snapshot) => {
    messagesDiv.innerHTML = "";
    allMessages = {};

    const entries = [];

    snapshot.forEach((child) => {
      entries.push({ key: child.key, data: child.val() });
    });

    entries.sort((a, b) => {
      const pinA = a.data.pinned ? 1 : 0;
      const pinB = b.data.pinned ? 1 : 0;
      if (pinA !== pinB) return pinB - pinA;
      return (b.data.time || 0) - (a.data.time || 0);
    });

    entries.forEach(({key, data}) => {
      allMessages[key] = data;
      renderMessage(key, data);
    });

    updateStats();

    if (entries.length > lastCount && lastCount !== 0) {
      document.getElementById("notifSound").play();
      showToast();

      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
      }
    }

    lastCount = entries.length;
  });
}

function renderMessage(key, data) {
  const div = document.createElement("div");
  div.className = "card" + (!data.read ? " unread" : "");
  div.style.border = data.pinned ? "2px solid gold" : div.style.border;

  const statusValue = cleanStatus(data.status);
  const followUp = data.followUpDate || "";

  div.innerHTML = `
    <b>Name:</b> ${data.name || ""}<br>
    <b>Email:</b> ${data.email || ""}<br>
    <b>Message:</b> ${data.message || ""}<br>
    <small>${data.time ? new Date(data.time).toLocaleString() : ""}</small><br>

    <span class="badge ${data.read ? "" : "badge-unread"}">${data.read ? "Read" : "Unread"}</span>
    <span class="badge badge-status">${statusValue}</span>
    ${followUp ? `<span class="badge badge-follow">Follow up: ${followUp}</span>` : ""}
    <br>

    <button onclick="deleteMsg('${key}')">🗑️ Delete</button>
    <button class="pin-btn" onclick="pinMsg('${key}')">${data.pinned ? "📌 Unpin" : "📌 Pin"}</button>
    <button class="read-btn" onclick="toggleRead('${key}')">${data.read ? "Mark Unread" : "Mark Read"}</button>
    <button class="reply-btn" onclick="openReply('${key}')">📧 Reply</button>
    <br>

    <select class="status-select" onchange="updateLeadStatus('${key}', this.value)">
      <option ${statusValue === "New Lead" ? "selected" : ""}>New Lead</option>
      <option ${statusValue === "Contacted" ? "selected" : ""}>Contacted</option>
      <option ${statusValue === "Follow Up" ? "selected" : ""}>Follow Up</option>
      <option ${statusValue === "Client" ? "selected" : ""}>Client</option>
    </select>

    <input class="followup-input" type="date" value="${followUp}" onchange="setFollowUp('${key}', this.value)">
  `;

  messagesDiv.appendChild(div);
}

function saveMessage(key, changes) {
  const msg = allMessages[key];
  set(ref(db, "feedback/" + key), {
    ...msg,
    ...changes
  });
}

window.deleteMsg = function(key){
  remove(ref(db, "feedback/" + key));
};

window.pinMsg = function(key){
  const msg = allMessages[key];
  saveMessage(key, { pinned: !msg.pinned });
};

window.toggleRead = function(key){
  const msg = allMessages[key];
  saveMessage(key, { read: !msg.read });
};

window.updateLeadStatus = function(key, value){
  saveMessage(key, { status: value });
};

window.setFollowUp = function(key, value){
  saveMessage(key, { followUpDate: value });
};

window.openReply = function(key) {
  const msg = allMessages[key];
  currentReplyKey = key;

  document.getElementById("replyTo").value = msg.email || "";
  document.getElementById("replyName").value = msg.name || "";
  document.getElementById("replyMessage").value = `Hi ${msg.name || ""},\n\n`;
  document.getElementById("emailStatus").innerText = "";

  saveMessage(key, { read: true });
  document.getElementById("replyBox").style.display = "flex";
};

window.closeReply = function() {
  document.getElementById("replyBox").style.display = "none";
};

window.generateAIReply = function() {

  const name = document.getElementById("replyName").value || "there";

  document.getElementById("replyMessage").value =
`Hi ${name},

Thank you for getting in touch with Vinctec.

I appreciate your message and I'd be happy to help. At Vinctec, we support businesses with website design, development and IT solutions that help them look more professional online and manage their work more easily.

Could you please share a little more information about what you need, your ideal timeframe, and any specific goals you have for your website or project?

Once I have that information, I can suggest the best next steps.

Kind regards,

Vincent
Vinctec
https://vinctec.co.uk`;

};

window.generateOutreach = function() {
  const company = document.getElementById("companyName").value || "your business";
  const type = document.getElementById("companyType").value || "business";

  document.getElementById("outreachOutput").value =
`Subject: Website support for ${company}

Hi,

My name is Vincent and I run Vinctec.

I help businesses with website design, development and IT solutions. I came across ${company} and wanted to introduce myself in case you're looking to improve your online presence or need technical support.

For a ${type}, a strong website can help customers understand your services, contact you quickly and trust your business before they even visit or call.

If you'd be interested, I'd be happy to have a quick chat about how Vinctec could help.

Kind regards,

Vincent
Vinctec
https://vinctec.co.uk`;
};

window.generateAudit = function() {
  const business = document.getElementById("auditBusiness").value || "this business";
  const type = document.getElementById("auditType").value || "local business";
  const site = document.getElementById("auditWebsite").value || "their website";

  document.getElementById("auditOutput").value =
`Website Audit for ${business}
Website: ${site}
Business type: ${type}

Estimated Website Score: 68/100

What looks important to check:
1. Homepage clarity — does the first screen explain what ${business} does in under 5 seconds?
2. Mobile experience — most customers will visit on phone, so buttons and text need to be easy to use.
3. Contact journey — the call, email, booking or enquiry button should be obvious.
4. Trust signals — reviews, real photos, location, opening times and previous work help customers trust the business.
5. Speed and design — slow pages or old design can make customers leave before contacting them.
6. SEO basics — page titles, descriptions and service keywords should help people find the business on Google.

Recommended Vinctec services:
• Website redesign or landing page refresh
• Mobile-friendly contact form
• SEO title and description improvements
• Booking/contact call-to-action upgrade
• Better images, reviews and trust sections

Message you can send:

Hi,

My name is Vincent and I run Vinctec. I had a quick look at ${business}'s online presence and noticed a few areas where the website could potentially bring in more enquiries, especially around mobile design, contact buttons and trust-building sections.

I help ${type}s with modern website design, development and IT solutions. If you're open to it, I'd be happy to share a few simple improvements that could make the website look more professional and easier for customers to use.

Kind regards,
Vincent
Vinctec
https://vinctec.co.uk`;
};

window.copyAudit = function() {
  const output = document.getElementById("auditOutput");
  if (!output.value.trim()) {
    output.value = "Generate an audit first, then copy it.";
    return;
  }
  output.select();
  document.execCommand("copy");
  alert("Audit copied!");
};



function escapeHtmlText(value) {
  return String(value).replace(/[&<>"']/g, function(char) {
    return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char];
  });
}

window.generateWebsiteStarter = function() {
  const business = document.getElementById("siteBusiness").value.trim() || "Your Business";
  const type = document.getElementById("siteType").value.trim() || "local business";
  const colours = document.getElementById("siteColours").value.trim() || "blue, white and dark navy";
  const features = document.getElementById("siteFeatures").value.trim() || "services, gallery, testimonials and contact form";

  const safeBusiness = escapeHtmlText(business);
  const safeType = escapeHtmlText(type);
  const safeColours = escapeHtmlText(colours);
  const safeFeatures = escapeHtmlText(features);

  const code = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${safeBusiness}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{background:#0f172a;color:white;line-height:1.6;}
header{padding:24px 8%;display:flex;justify-content:space-between;align-items:center;background:#111827;position:sticky;top:0;}
.logo{font-size:24px;font-weight:bold;color:#38bdf8;}
nav a{color:white;text-decoration:none;margin-left:18px;}
.hero{padding:90px 8%;background:linear-gradient(135deg,#0f172a,#1e3a8a);}
.hero h1{font-size:48px;max-width:780px;}
.hero p{font-size:18px;max-width:650px;margin:18px 0;color:#d1d5db;}
.btn{display:inline-block;padding:12px 20px;border-radius:8px;background:#2563eb;color:white;text-decoration:none;margin-top:10px;}
section{padding:60px 8%;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:25px;}
.card{background:#1f2937;padding:20px;border-radius:14px;border:1px solid #334155;}
.card h3{color:#38bdf8;margin-bottom:8px;}
.contact{background:#111827;}
input,textarea{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;}
button{padding:12px 18px;border:none;border-radius:8px;background:#2563eb;color:white;cursor:pointer;}
footer{text-align:center;padding:20px;background:#020617;color:#94a3b8;}
@media(max-width:700px){.hero h1{font-size:34px;}header{display:block;}nav{margin-top:12px;}nav a{display:inline-block;margin:6px 12px 0 0;}}
</style>
</head>
<body>
<header>
  <div class="logo">${safeBusiness}</div>
  <nav>
    <a href="#services">Services</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<div class="hero">
  <h1>Professional ${safeType} services built around your needs.</h1>
  <p>${safeBusiness} provides reliable, friendly and professional support for customers looking for quality service and easy communication.</p>
  <a class="btn" href="#contact">Get a Free Quote</a>
</div>

<section id="services">
  <h2>Our Services</h2>
  <p>Suggested features for this website: ${safeFeatures}.</p>
  <div class="grid">
    <div class="card"><h3>Fast Enquiries</h3><p>Make it simple for customers to request quotes or ask questions.</p></div>
    <div class="card"><h3>Mobile Friendly</h3><p>Designed to look professional on phones, tablets and desktops.</p></div>
    <div class="card"><h3>Trust & Results</h3><p>Show reviews, photos, previous work and key business information.</p></div>
  </div>
</section>

<section id="about">
  <h2>About ${safeBusiness}</h2>
  <p>We are a local ${safeType} focused on quality, customer service and reliable results.</p>
  <p>Suggested colour direction: ${safeColours}.</p>
</section>

<section class="contact" id="contact">
  <h2>Contact Us</h2>
  <p>Fill in the form and we will get back to you as soon as possible.</p>
  <form>
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Email Address" required>
    <input type="tel" placeholder="Phone Number">
    <textarea placeholder="Tell us what you need" required></textarea>
    <button type="submit">Send Enquiry</button>
  </form>
</section>

<footer>
  © ${new Date().getFullYear()} ${safeBusiness}. Website starter generated by Vinctec.
</footer>
</body>
</html>`;

  document.getElementById("websiteBuilderOutput").value = code;
};

window.copyWebsiteStarter = function() {
  const output = document.getElementById("websiteBuilderOutput");
  if (!output.value.trim()) {
    output.value = "Generate a website starter first, then copy it.";
    return;
  }
  output.select();
  document.execCommand("copy");
  alert("Website starter code copied!");
};

window.sendReply = function() {
  const toEmail = document.getElementById("replyTo").value;
  const toName = document.getElementById("replyName").value;
  const message = document.getElementById("replyMessage").value;
  const emailStatus = document.getElementById("emailStatus");

  if (!message.trim()) {
    emailStatus.innerText = "Please type a message first.";
    emailStatus.style.color = "red";
    return;
  }

  emailStatus.innerText = "Sending...";
  emailStatus.style.color = "#0ff";

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    to_email: toEmail,
    to_name: toName,
    message: message
  })
  .then(() => {
    emailStatus.innerText = "Email sent successfully!";
    emailStatus.style.color = "lime";
    if (currentReplyKey) {
      saveMessage(currentReplyKey, { status: "Contacted", read: true });
    }
  })
  .catch((error) => {
    emailStatus.innerText = "Failed to send email: " + (error.text || JSON.stringify(error));
    emailStatus.style.color = "red";
    console.error(error);
  });
};

searchInput.addEventListener("input", () => {
  const value = searchInput.value.toLowerCase();

  document.querySelectorAll(".card").forEach(card => {
    card.style.display =
      card.innerText.toLowerCase().includes(value)
        ? "block"
        : "none";
  });
});

window.logout = function () {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
};
</script>

</body>
</html>
