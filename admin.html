<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.header {
  padding: 20px;
  text-align: center;
  background: #111827;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1f2937;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}

small {
  color: #9ca3af;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  background: red;
  color: white;
  cursor: pointer;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">
  <h2>🔒 Admin Dashboard</h2>
  <p id="status">Checking login...</p>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

  <!-- SEARCH -->
  <input id="search" type="text"
    placeholder="Search messages..."
    style="padding:10px;width:100%;border-radius:8px;border:none;margin-bottom:10px;">

  <!-- COUNTER -->
  <div id="counter" style="margin-bottom:10px;color:#0ff;"></div>

  <!-- MESSAGES -->
  <div id="messages"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
import { getDatabase, ref, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyB7PRz9K6IMr3foH5xsaVwmRTFJUlpv1Sg",
  authDomain: "vinctec-admin.firebaseapp.com",
  databaseURL: "https://vinctec-admin-default-rtdb.firebaseio.com",
  projectId: "vinctec-admin",
  storageBucket: "vinctec-admin.firebasestorage.app",
  messagingSenderId: "714000687361",
  appId: "1:714000687361:web:db2cc5745df0cb91b9bb00"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const allowedEmail = "obiwuru010@gmail.com";

const status = document.getElementById("status");
const messagesDiv = document.getElementById("messages");
const searchInput = document.getElementById("search");

let allMessages = {};
let lastCount = 0;

/* 🔊 SOUND */
const notifySound = new Audio("https://www.soundjay.com/buttons/sounds/button-09.mp3");

/* LOGIN */
onAuthStateChanged(auth, (user) => {
  if (user && user.email === allowedEmail) {
    status.innerText = "Logged in as: " + user.email;
    loadMessages();
  } else {
    window.location.href = "login.html";
  }
});

/* LOAD MESSAGES */
function loadMessages() {
  const feedbackRef = ref(db, "feedback");

  onValue(feedbackRef, (snapshot) => {

    messagesDiv.innerHTML = "";
    allMessages = {};

    let count = 0;

    snapshot.forEach((child) => {
      const key = child.key;
      const data = child.val();

      allMessages[key] = data;
      count++;

      renderMessage(key, data);
    });

    document.getElementById("counter").innerText =
      "Total Messages: " + count;

    /* 🔥 NEW MESSAGE ALERT */
    if (count > lastCount && lastCount !== 0) {
      alert("🔥 New message received!");
      notifySound.play();

      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
      }
    }

    lastCount = count;
  });
}

/* RENDER MESSAGE */
function renderMessage(key, data) {

  const div = document.createElement("div");
  div.className = "card";

  div.style.border = data.pinned ? "2px solid gold" : "none";

  div.innerHTML = `
    <b>Name:</b> ${data.name}<br>
    <b>Email:</b> ${data.email}<br>
    <b>Message:</b> ${data.message}<br>
    <small>${new Date(data.time).toLocaleString()}</small>
    <br>

    <button onclick="deleteMsg('${key}')">🗑️ Delete</button>

    <button onclick="pinMsg('${key}')">📌 Pin</button>

    <button onclick="sendEmail('${data.email}','${data.name}')">
      📧 Reply
    </button>
  `;

  messagesDiv.appendChild(div);
}

/* DELETE */
window.deleteMsg = function(key){
  remove(ref(db, "feedback/" + key));
};

/* PIN */
window.pinMsg = function(key){
  const msg = allMessages[key];
  set(ref(db, "feedback/" + key), {
    ...msg,
    pinned: !msg.pinned
  });
};

/* EMAIL (MANUAL SAFE VERSION) */
window.sendEmail = function(email, name) {
  const subject = "Reply from Vinctec";
  const body = `Hi ${name},`;

  window.location.href =
    `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
};

/* SEARCH */
searchInput.addEventListener("input", () => {
  const value = searchInput.value.toLowerCase();

  document.querySelectorAll(".card").forEach(card => {
    card.style.display =
      card.innerText.toLowerCase().includes(value)
        ? "block"
        : "none";
  });
});

/* LOGOUT */
window.logout = function () {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
};

</script>

</body>
</html>
