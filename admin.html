<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.box {
  background: #111827;
  padding: 30px;
  border-radius: 12px;
  width: 320px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,255,255,0.15);
}

button {
  margin-top: 15px;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  background: red;
  color: white;
  cursor: pointer;
}

#status {
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="box">
  <h2>🔒 Admin Panel</h2>
  <p id="status">Loading admin...</p>
  <button onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7PRz9K6IMr3foH5xsaVwmRTFJUlpv1Sg",
  authDomain: "vinctec-admin.firebaseapp.com",
  projectId: "vinctec-admin",
  storageBucket: "vinctec-admin.firebasestorage.app",
  messagingSenderId: "714000687361",
  appId: "1:714000687361:web:db2cc5745df0cb91b9bb00"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ONLY YOU ALLOWED
const allowedEmail = "obiwuru010@gmail.com";

// Smooth auth check (no flash)
onAuthStateChanged(auth, (user) => {

  if (user && user.email === allowedEmail) {
    document.getElementById("status").innerText =
      "Logged in as: " + user.email;
  } 
  else {
    document.getElementById("status").innerText = "Redirecting...";
    setTimeout(() => {
      window.location.replace("login.html");
    }, 300);
  }

});

// Logout
window.logout = function () {
  signOut(auth).then(() => {
    window.location.replace("login.html");
  });
};
</script>

</body>
</html>
