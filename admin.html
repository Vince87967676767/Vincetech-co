<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.header {
  padding: 20px;
  text-align: center;
  background: #111827;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1f2937;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}

small {
  color: #9ca3af;
}

button {
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  background: red;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
  <h2>🔒 Admin Dashboard</h2>
  <p id="status">Checking login...</p>
  <button onclick="logout()">Logout</button>
</div>

<div class="container" id="messages"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

import { getDatabase, ref, onValue } 
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7PRz9K6IMr3foH5xsaVwmRTFJUlpv1Sg",
  authDomain: "vinctec-admin.firebaseapp.com",
  databaseURL: "https://vinctec-admin-default-rtdb.firebaseio.com",
  projectId: "vinctec-admin",
  storageBucket: "vinctec-admin.firebasestorage.app",
  messagingSenderId: "714000687361",
  appId: "1:714000687361:web:db2cc5745df0cb91b9bb00"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const allowedEmail = "obiwuru010@gmail.com";

const status = document.getElementById("status");
const messagesDiv = document.getElementById("messages");

// LOGIN CHECK
onAuthStateChanged(auth, (user) => {

  if (user && user.email === allowedEmail) {
    status.innerText = "Logged in as: " + user.email;

    loadMessages();

  } else {
    status.innerText = "Not authorised. Redirecting...";
    setTimeout(() => {
      window.location.href = "login.html";
    }, 1000);
  }
});

// LOAD FIREBASE MESSAGES
function loadMessages() {
  const feedbackRef = ref(db, "feedback");

  onValue(feedbackRef, (snapshot) => {

    messagesDiv.innerHTML = "";

    if (!snapshot.exists()) {
      messagesDiv.innerHTML = "<p>No messages yet</p>";
      return;
    }

    snapshot.forEach((child) => {
      const data = child.val();

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <b>Name:</b> ${data.name}<br>
        <b>Email:</b> ${data.email}<br>
        <b>Message:</b> ${data.message}<br>
        <small>${new Date(data.time).toLocaleString()}</small>
      `;

      messagesDiv.appendChild(div);
    });
  });
}

// LOGOUT
window.logout = function () {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
};
</script>

</body>
</html>
