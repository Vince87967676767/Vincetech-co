<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.header {
  padding: 20px;
  text-align: center;
  background: #111827;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1f2937;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}

.card.unread {
  box-shadow: 0 0 0 2px #22c55e;
}

small {
  color: #9ca3af;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  background: red;
  color: white;
  cursor: pointer;
  margin-top: 10px;
  margin-right: 5px;
}

button:hover {
  opacity: 0.9;
}

.reply-btn {
  background: #2563eb;
}

.pin-btn {
  background: #ca8a04;
}

.read-btn {
  background: #16a34a;
}

.status-select, .followup-input {
  padding: 8px;
  border: none;
  border-radius: 6px;
  margin-top: 10px;
  margin-right: 5px;
}

#toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #22c55e;
  color: white;
  padding: 12px 16px;
  border-radius: 8px;
  display: none;
  z-index: 9999;
}

#replyBox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 9998;
  align-items: center;
  justify-content: center;
}

.reply-card {
  background: #1f2937;
  padding: 20px;
  border-radius: 12px;
  width: 90%;
  max-width: 500px;
}

.reply-card input,
.reply-card textarea,
.tool-box input,
.tool-box textarea {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: none;
  border-radius: 8px;
  box-sizing: border-box;
}

.reply-card textarea,
.tool-box textarea {
  height: 140px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin: 15px 0;
}

.stat-box, .tool-box {
  background: #1f2937;
  border-radius: 10px;
  padding: 15px;
}

.stat-number {
  font-size: 28px;
  font-weight: bold;
  color: #0ff;
}

.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 15px;
  margin: 15px 0;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 999px;
  background: #334155;
  color: #fff;
  font-size: 12px;
  margin-top: 6px;
}

.badge-unread { background: #16a34a; }
.badge-status { background: #2563eb; }
.badge-follow { background: #9333ea; }
</style>
</head>

<body>

<audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" preload="auto"></audio>

<div id="toast">New message received 🔔</div>

<div id="replyBox">
  <div class="reply-card">
    <h3>📧 Reply to Customer</h3>

    <input id="replyTo" readonly>
    <input id="replyName" readonly>

    <textarea id="replyMessage" placeholder="Type your reply here..."></textarea>

    <button class="pin-btn" onclick="generateAIReply()">✨ Generate AI Reply</button>
    <button class="reply-btn" onclick="sendReply()">Send Email</button>
    <button onclick="closeReply()">Cancel</button>

    <p id="emailStatus"></p>
  </div>
</div>

<div class="header">
  <h2>🔒 Admin Dashboard</h2>
  <p id="status">Checking login...</p>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

  <input id="search" type="text"
    placeholder="Search messages..."
    style="padding:10px;width:100%;border-radius:8px;border:none;margin-bottom:10px;box-sizing:border-box;">

  <div id="counter" style="margin-bottom:10px;color:#0ff;"></div>

  <div class="stats-grid">
    <div class="stat-box"><div class="stat-number" id="statTotal">0</div><div>Total Messages</div></div>
    <div class="stat-box"><div class="stat-number" id="statUnread">0</div><div>Unread</div></div>
    <div class="stat-box"><div class="stat-number" id="statLeads">0</div><div>Active Leads</div></div>
    <div class="stat-box"><div class="stat-number" id="statClients">0</div><div>Clients</div></div>
    <div class="stat-box"><div class="stat-number" id="statConversion">0%</div><div>Conversion Rate</div></div>
  </div>

  <div class="tool-grid">
    <div class="tool-box">
      <h3>✨ AI Business Outreach</h3>
      <input id="companyName" placeholder="Company name">
      <input id="companyType" placeholder="Business type, e.g. barber, restaurant, builder">
      <button class="reply-btn" onclick="generateOutreach()">Generate Outreach Email</button>
      <textarea id="outreachOutput" placeholder="Generated outreach email will appear here..."></textarea>
    </div>

    <div class="tool-box">
      <h3>🔍 AI Website Audit</h3>
      <input id="auditWebsite" placeholder="Paste business website URL">
      <button class="reply-btn" onclick="generateAudit()">Generate Audit Points</button>
      <textarea id="auditOutput" placeholder="Website audit ideas will appear here..."></textarea>
    </div>
  </div>

  <h3>📥 Messages</h3>
  <div id="messages"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
import { getDatabase, ref, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

emailjs.init({
  publicKey: "gNIrD27eCoUVVUR0B"
});

const EMAILJS_SERVICE_ID = "service_omro2oc";
const EMAILJS_TEMPLATE_ID = "template_249t7dk";

const firebaseConfig = {
  apiKey: "AIzaSyB7PRz9K6IMr3foH5xsaVwmRTFJUlpv1Sg",
  authDomain: "vinctec-admin.firebaseapp.com",
  databaseURL: "https://vinctec-admin-default-rtdb.firebaseio.com",
  projectId: "vinctec-admin",
  storageBucket: "vinctec-admin.firebasestorage.app",
  messagingSenderId: "714000687361",
  appId: "1:714000687361:web:db2cc5745df0cb91b9bb00"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const allowedEmail = "obiwuru010@gmail.com";

const status = document.getElementById("status");
const messagesDiv = document.getElementById("messages");
const searchInput = document.getElementById("search");

let allMessages = {};
let lastCount = 0;
let currentReplyKey = null;

function showToast() {
  const toast = document.getElementById("toast");
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 3000);
}

function cleanStatus(value) {
  return value || "New Lead";
}

function updateStats() {
  const messages = Object.values(allMessages);
  const total = messages.length;
  const unread = messages.filter(m => !m.read).length;
  const clients = messages.filter(m => cleanStatus(m.status) === "Client").length;
  const activeLeads = messages.filter(m => cleanStatus(m.status) !== "Client").length;
  const conversion = total ? Math.round((clients / total) * 100) : 0;

  document.getElementById("statTotal").innerText = total;
  document.getElementById("statUnread").innerText = unread;
  document.getElementById("statLeads").innerText = activeLeads;
  document.getElementById("statClients").innerText = clients;
  document.getElementById("statConversion").innerText = conversion + "%";
  document.getElementById("counter").innerText = "Total Messages: " + total;
}

onAuthStateChanged(auth, (user) => {
  if (user && user.email === allowedEmail) {
    status.innerText = "Logged in as: " + user.email;
    loadMessages();
  } else {
    window.location.href = "login.html";
  }
});

function loadMessages() {
  const feedbackRef = ref(db, "feedback");

  onValue(feedbackRef, (snapshot) => {
    messagesDiv.innerHTML = "";
    allMessages = {};

    const entries = [];

    snapshot.forEach((child) => {
      entries.push({ key: child.key, data: child.val() });
    });

    entries.sort((a, b) => {
      const pinA = a.data.pinned ? 1 : 0;
      const pinB = b.data.pinned ? 1 : 0;
      if (pinA !== pinB) return pinB - pinA;
      return (b.data.time || 0) - (a.data.time || 0);
    });

    entries.forEach(({key, data}) => {
      allMessages[key] = data;
      renderMessage(key, data);
    });

    updateStats();

    if (entries.length > lastCount && lastCount !== 0) {
      document.getElementById("notifSound").play();
      showToast();

      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
      }
    }

    lastCount = entries.length;
  });
}

function renderMessage(key, data) {
  const div = document.createElement("div");
  div.className = "card" + (!data.read ? " unread" : "");
  div.style.border = data.pinned ? "2px solid gold" : div.style.border;

  const statusValue = cleanStatus(data.status);
  const followUp = data.followUpDate || "";

  div.innerHTML = `
    <b>Name:</b> ${data.name || ""}<br>
    <b>Email:</b> ${data.email || ""}<br>
    <b>Message:</b> ${data.message || ""}<br>
    <small>${data.time ? new Date(data.time).toLocaleString() : ""}</small><br>

    <span class="badge ${data.read ? "" : "badge-unread"}">${data.read ? "Read" : "Unread"}</span>
    <span class="badge badge-status">${statusValue}</span>
    ${followUp ? `<span class="badge badge-follow">Follow up: ${followUp}</span>` : ""}
    <br>

    <button onclick="deleteMsg('${key}')">🗑️ Delete</button>
    <button class="pin-btn" onclick="pinMsg('${key}')">${data.pinned ? "📌 Unpin" : "📌 Pin"}</button>
    <button class="read-btn" onclick="toggleRead('${key}')">${data.read ? "Mark Unread" : "Mark Read"}</button>
    <button class="reply-btn" onclick="openReply('${key}')">📧 Reply</button>
    <br>

    <select class="status-select" onchange="updateLeadStatus('${key}', this.value)">
      <option ${statusValue === "New Lead" ? "selected" : ""}>New Lead</option>
      <option ${statusValue === "Contacted" ? "selected" : ""}>Contacted</option>
      <option ${statusValue === "Follow Up" ? "selected" : ""}>Follow Up</option>
      <option ${statusValue === "Client" ? "selected" : ""}>Client</option>
    </select>

    <input class="followup-input" type="date" value="${followUp}" onchange="setFollowUp('${key}', this.value)">
  `;

  messagesDiv.appendChild(div);
}

function saveMessage(key, changes) {
  const msg = allMessages[key];
  set(ref(db, "feedback/" + key), {
    ...msg,
    ...changes
  });
}

window.deleteMsg = function(key){
  remove(ref(db, "feedback/" + key));
};

window.pinMsg = function(key){
  const msg = allMessages[key];
  saveMessage(key, { pinned: !msg.pinned });
};

window.toggleRead = function(key){
  const msg = allMessages[key];
  saveMessage(key, { read: !msg.read });
};

window.updateLeadStatus = function(key, value){
  saveMessage(key, { status: value });
};

window.setFollowUp = function(key, value){
  saveMessage(key, { followUpDate: value });
};

window.openReply = function(key) {
  const msg = allMessages[key];
  currentReplyKey = key;

  document.getElementById("replyTo").value = msg.email || "";
  document.getElementById("replyName").value = msg.name || "";
  document.getElementById("replyMessage").value = `Hi ${msg.name || ""},\n\n`;
  document.getElementById("emailStatus").innerText = "";

  saveMessage(key, { read: true });
  document.getElementById("replyBox").style.display = "flex";
};

window.closeReply = function() {
  document.getElementById("replyBox").style.display = "none";
};

window.generateAIReply = function() {

  const name = document.getElementById("replyName").value || "there";

  document.getElementById("replyMessage").value =
`Hi ${name},

Thank you for getting in touch with Vinctec.

I appreciate your message and I'd be happy to help. At Vinctec, we support businesses with website design, development and IT solutions that help them look more professional online and manage their work more easily.

Could you please share a little more information about what you need, your ideal timeframe, and any specific goals you have for your website or project?

Once I have that information, I can suggest the best next steps.

Kind regards,

Vincent
Vinctec
https://vinctec.co.uk`;

};

window.generateOutreach = function() {
  const company = document.getElementById("companyName").value || "your business";
  const type = document.getElementById("companyType").value || "business";

  document.getElementById("outreachOutput").value =
`Subject: Website support for ${company}

Hi,

My name is Vincent and I run Vinctec.

I help businesses with website design, development and IT solutions. I came across ${company} and wanted to introduce myself in case you're looking to improve your online presence or need technical support.

For a ${type}, a strong website can help customers understand your services, contact you quickly and trust your business before they even visit or call.

If you'd be interested, I'd be happy to have a quick chat about how Vinctec could help.

Kind regards,

Vincent
Vinctec
https://vinctec.co.uk`;
};

window.generateAudit = function() {
  const site = document.getElementById("auditWebsite").value || "the website";

  document.getElementById("auditOutput").value =
`Website audit ideas for ${site}:

1. Check if the homepage clearly explains what the business does.
2. Check if the contact button is easy to find on mobile.
3. Check if the website loads quickly and looks professional.
4. Check if the design builds trust with customers.
5. Check if services, pricing or enquiry steps are clear.
6. Suggest adding a modern contact form or booking system.
7. Suggest improving SEO titles and page descriptions.
8. Suggest adding customer reviews, images and strong call-to-action buttons.

You can use these points to create a helpful message to the business.`;
};

window.sendReply = function() {
  const toEmail = document.getElementById("replyTo").value;
  const toName = document.getElementById("replyName").value;
  const message = document.getElementById("replyMessage").value;
  const emailStatus = document.getElementById("emailStatus");

  if (!message.trim()) {
    emailStatus.innerText = "Please type a message first.";
    emailStatus.style.color = "red";
    return;
  }

  emailStatus.innerText = "Sending...";
  emailStatus.style.color = "#0ff";

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    to_email: toEmail,
    to_name: toName,
    message: message
  })
  .then(() => {
    emailStatus.innerText = "Email sent successfully!";
    emailStatus.style.color = "lime";
    if (currentReplyKey) {
      saveMessage(currentReplyKey, { status: "Contacted", read: true });
    }
  })
  .catch((error) => {
    emailStatus.innerText = "Failed to send email: " + (error.text || JSON.stringify(error));
    emailStatus.style.color = "red";
    console.error(error);
  });
};

searchInput.addEventListener("input", () => {
  const value = searchInput.value.toLowerCase();

  document.querySelectorAll(".card").forEach(card => {
    card.style.display =
      card.innerText.toLowerCase().includes(value)
        ? "block"
        : "none";
  });
});

window.logout = function () {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
};
</script>

</body>
</html>
