<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vinctec.co.uk</title>

<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- YOUR ORIGINAL CSS (UNCHANGED) -->
<style>
/* (ALL YOUR DESIGN STAYS EXACTLY THE SAME — NOT REMOVED, NOT EDITED) */
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif;}
body{background: linear-gradient(135deg, #ffe4e6, #dbeafe, #ffffff);padding:40px;}
.icon-wrapper{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px;}
.icon-box{position: relative;background: rgba(255,255,255,0.6);backdrop-filter: blur(10px);border-radius:18px;text-align:center;text-decoration:none;color:#1f2937;padding:30px 20px;transition: all 0.4s ease;box-shadow: 0 8px 20px rgba(0,0,0,0.05);overflow: hidden;}
.icon-box::before{content:'';position:absolute;top:0; left:0; right:0; bottom:0;background: linear-gradient(270deg, #f472b6, #9333ea, #3b82f6, #f43f5e);background-size: 600% 600%;opacity:0.12;border-radius:18px;z-index:0;animation: gradientShift 6s ease infinite;}
@keyframes gradientShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.icon{position: relative;z-index:1;width:65px;height:65px;margin:0 auto 15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;background: linear-gradient(270deg, #f472b6, #9333ea, #3b82f6, #f43f5e);background-size: 600% 600%;animation: iconGlow 6s ease infinite, iconPulse 2.5s ease-in-out infinite;-webkit-background-clip: text;-webkit-text-fill-color: transparent;}
@keyframes iconGlow{0%{background-position:0% 50%;}100%{background-position:100% 50%;}}
@keyframes iconPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.25);}}
.icon-box h3,.icon-box p{position:relative;z-index:1;}
.icon-box:hover{transform: translateY(-8px);}
</style>
</head>

<body>

<div class="icon-wrapper">
  <a href="index.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-house"></i></div>
    <h3>Home</h3>
    <p>Back to main page</p>
  </a>

  <a href="services.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-laptop-code"></i></div>
    <h3>Services</h3>
    <p>Web design & development</p>
  </a>

  <a href="contact.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-envelope"></i></div>
    <h3>Contact</h3>
    <p>Get in touch</p>
  </a>

  <a href="about.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-user"></i></div>
    <h3>About</h3>
    <p>Who we are</p>
  </a>
</div>

<!-- YOUR EXISTING FORM (UNCHANGED DESIGN) -->
<div class="myform-container">

  <input type="checkbox" id="theme-toggle">
  <label for="theme-toggle" class="theme-switch">
    <span class="icon">🌙</span>
  </label>

  <input type="radio" name="myform-tab" id="signin" checked>
  <input type="radio" name="myform-tab" id="feedback">

  <div class="tab-header">
    <label for="signin">Sign In</label>
    <label for="feedback">Feedback</label>
  </div>

  <div class="tab-content">

    <div class="tab" id="signin-tab">
      <form>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
      </form>
    </div>

    <div class="tab" id="feedback-tab">
      <form id="feedback-form">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <textarea id="message" placeholder="Your Feedback" required></textarea>
        <button type="submit">Submit Feedback</button>
      </form>
    </div>

  </div>
</div>

<!-- 🔥 ONLY ADDITION: FIREBASE (NO DESIGN CHANGE) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7PRz9K6IMr3foH5xsaVwmRTFJUlpv1Sg",
  authDomain: "vinctec-admin.firebaseapp.com",
  databaseURL: "https://vinctec-admin-default-rtdb.firebaseio.com",
  projectId: "vinctec-admin",
  storageBucket: "vinctec-admin.firebasestorage.app",
  messagingSenderId: "714000687361",
  appId: "1:714000687361:web:db2cc5745df0cb91b9bb00"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

document.addEventListener("DOMContentLoaded", () => {

  const form = document.getElementById("feedback-form");

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const message = document.getElementById("message").value;

    if (!name || !email || !message) {
      alert("Please fill all fields");
      return;
    }

    push(ref(db, "feedback"), {
      name,
      email,
      message,
      time: Date.now()
    })
    .then(() => {
      alert("Message sent successfully!");
      form.reset();
    })
    .catch((err) => {
      alert(err.message);
    });

  });

});
</script>

</body>
</html>
