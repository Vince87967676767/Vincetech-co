<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vinctec.co.uk</title>

<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif;}

body{
  background: linear-gradient(135deg, #ffe4e6, #dbeafe, #ffffff);
  padding:40px;
}

.icon-wrapper{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.icon-box{
  position: relative;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  border-radius:18px;
  text-align:center;
  text-decoration:none;
  color:#1f2937;
  padding:30px 20px;
  transition: all 0.4s ease;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  overflow: hidden;
}

.icon-box::before{
  content:'';
  position:absolute;
  inset:0;
  background: linear-gradient(270deg, #f472b6, #9333ea, #3b82f6, #f43f5e);
  background-size: 600% 600%;
  opacity:0.12;
  border-radius:18px;
  animation: gradientShift 6s ease infinite;
}

@keyframes gradientShift {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.icon{
  position: relative;
  z-index:1;
  width:65px;
  height:65px;
  margin:0 auto 15px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  background: linear-gradient(270deg,#f472b6,#9333ea,#3b82f6,#f43f5e);
  background-size: 600% 600%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.icon-box:hover{
  transform: translateY(-8px);
}
</style>
</head>

<body>

<div class="icon-wrapper">
  <a href="/" class="icon-box">
    <div class="icon"><i class="fa-solid fa-house"></i></div>
    <h3>Home</h3>
    <p>Back to main page</p>
  </a>

  <a href="/services.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-laptop-code"></i></div>
    <h3>Services</h3>
    <p>Web design & development</p>
  </a>

  <a href="/contact.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-envelope"></i></div>
    <h3>Contact</h3>
    <p>Get in touch</p>
  </a>

  <a href="/about.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-user"></i></div>
    <h3>About</h3>
    <p>Who we are</p>
  </a>
</div>

<!-- FORM -->
<div class="myform-container">

  <input type="radio" name="myform-tab" id="signin" checked>
  <input type="radio" name="myform-tab" id="feedback">

  <div class="tab-header">
    <label for="signin">Sign In</label>
    <label for="feedback">Feedback</label>
  </div>

  <div class="tab-content">

    <div class="tab" id="signin-tab">
      <form>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
      </form>
    </div>

    <div class="tab" id="feedback-tab">
      <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Email Address" required>
        <textarea placeholder="Your Feedback" required></textarea>
        <button type="submit">Submit Feedback</button>
      </form>
    </div>

  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="admin-panel" style="display:none; max-width:800px; margin:40px auto; padding:20px; background:white; border-radius:12px;">
  <h2>Admin Dashboard - Feedback</h2>
  <div id="feedback-list"></div>
</div>

<style>
.myform-container{max-width:450px;margin:50px auto;}
.tab-header{display:flex;gap:10px;}
.tab-header label{flex:1;padding:10px;background:#eee;text-align:center;cursor:pointer;}
.tab-content{padding:20px;}
input,textarea,button{width:100%;margin:10px 0;padding:10px;}
</style>

<script>
const demoUser = { username:"admin", password:"1234" };

const formContainer = document.querySelector(".myform-container");
const adminPanel = document.getElementById("admin-panel");
const feedbackListDiv = document.getElementById("feedback-list");

// LOGIN
document.querySelector("#signin-tab form").addEventListener("submit", function(e){
  e.preventDefault();

  const u = this.querySelector("input[type='text']").value;
  const p = this.querySelector("input[type='password']").value;

  if(u === demoUser.username && p === demoUser.password){
    alert("Login successful");

    formContainer.style.display = "none";
    adminPanel.style.display = "block";

    renderFeedback();
  } else {
    alert("Wrong login");
  }
});

// FEEDBACK
document.querySelector("#feedback-tab form").addEventListener("submit", function(e){
  e.preventDefault();

  const name = this.querySelector("input[type='text']").value;
  const email = this.querySelector("input[type='email']").value;
  const msg = this.querySelector("textarea").value;

  let feedback = JSON.parse(localStorage.getItem("feedbackList") || "[]");

  feedback.push({
    id: Date.now(),
    name, email, message: msg,
    date: new Date().toLocaleString()
  });

  localStorage.setItem("feedbackList", JSON.stringify(feedback));

  alert("Feedback saved!");
  this.reset();
});

// RENDER
function renderFeedback(){
  let feedback = JSON.parse(localStorage.getItem("feedbackList") || "[]");

  if(feedback.length === 0){
    feedbackListDiv.innerHTML = "<p>No feedback yet</p>";
    return;
  }

  feedbackListDiv.innerHTML = feedback.map(f=>`
    <div style="border:1px solid #ddd;padding:10px;margin:10px 0;">
      <b>${f.name}</b> (${f.email})<br>
      <small>${f.date}</small>
      <p>${f.message}</p>
    </div>
  `).join("");
}
</script>

</html>
