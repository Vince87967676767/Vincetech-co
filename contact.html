<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vinctec.co.uk</title>

<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif;}

body{
  background: linear-gradient(135deg, #ffe4e6, #dbeafe, #ffffff);
  padding:40px;
}

.icon-wrapper{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.icon-box{
  position: relative;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  border-radius:18px;
  text-align:center;
  text-decoration:none;
  color:#1f2937;
  padding:30px 20px;
  transition: all 0.4s ease;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  overflow: hidden;
}

.icon-box::before{
  content:'';
  position:absolute;
  top:0; left:0; right:0; bottom:0;
  background: linear-gradient(270deg, #f472b6, #9333ea, #3b82f6, #f43f5e);
  background-size: 600% 600%;
  opacity:0.12;
  border-radius:18px;
  z-index:0;
  animation: gradientShift 6s ease infinite;
}

@keyframes gradientShift {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.icon{
  position: relative;
  z-index:1;
  width:65px;
  height:65px;
  margin:0 auto 15px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:26px;
  transition: transform 0.4s ease, filter 0.4s ease;
  background: linear-gradient(270deg, #f472b6, #9333ea, #3b82f6, #f43f5e);
  background-size: 600% 600%;
  animation: iconGlow 6s ease infinite, iconPulse 2.5s ease-in-out infinite;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

@keyframes iconGlow {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

@keyframes iconPulse {
  0%, 100%{filter: brightness(1);}
  50%{filter: brightness(1.25);}
}

.icon-box h3{
  position: relative;
  z-index:1;
  margin-bottom:6px;
  font-size:18px;
}

.icon-box p{
  position: relative;
  z-index:1;
  font-size:14px;
  color:#4b5563;
}

.icon-box:hover{
  transform: translateY(-8px);
  box-shadow: 0 18px 35px rgba(0,0,0,0.08);
  background: rgba(255,255,255,0.8);
}

.icon-box:hover .icon{
  transform: scale(1.25) rotate(8deg);
  filter: brightness(1.5);
}
</style>
</head>

<body>

<div class="icon-wrapper">
  <a href="/" class="icon-box">
    <div class="icon"><i class="fa-solid fa-house"></i></div>
    <h3>Home</h3>
    <p>Back to main page</p>
  </a>

  <a href="/services.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-laptop-code"></i></div>
    <h3>Services</h3>
    <p>Web design & development</p>
  </a>

  <a href="/contact.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-envelope"></i></div>
    <h3>Contact</h3>
    <p>Get in touch</p>
  </a>

  <a href="/about.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-user"></i></div>
    <h3>About</h3>
    <p>Who we are</p>
  </a>
</div>

</body>

<div class="myform-container">

  <input type="checkbox" id="theme-toggle">
  <label for="theme-toggle" class="theme-switch">
    <span class="icon">🌙</span>
  </label>

  <input type="radio" name="myform-tab" id="signin" checked>
  <input type="radio" name="myform-tab" id="feedback">

  <div class="tab-header">
    <label for="signin">Sign In</label>
    <label for="feedback">Feedback</label>
  </div>

  <div class="tab-content">

    <div class="tab" id="signin-tab">
      <form>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
        <div class="link"><a href="#">Forgot Password?</a></div>
      </form>
    </div>

    <div class="tab" id="feedback-tab">
      <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Email Address" required>
        <textarea placeholder="Your Feedback" required></textarea>
        <button type="submit">Submit Feedback</button>
      </form>
    </div>

  </div>
</div>

<style>
.myform-container * { box-sizing:border-box; font-family:'Arial',sans-serif; transition: all 0.3s ease; }

#theme-toggle { display:none; }

.theme-switch {
  position:absolute; top:20px; right:20px;
  background:#ffb6c1; color:#fff; padding:8px 12px;
  border-radius:20px; cursor:pointer;
  z-index:10;
}

.myform-container {
  max-width:450px; margin:50px auto;
  border-radius:12px; overflow:hidden;
  background:linear-gradient(-45deg,#ffe4e6,#dbeafe,#ffffff);
  animation: floatForm 6s ease-in-out infinite;
}

@keyframes floatForm {
  0%{transform:translateY(0px);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0px);}
}
</style>

<header>
  <img src="NVLME0005.JPG" alt="Logo" class="glow-logo">
</header>

<div class="watermark-layer">
  <span><img src="NVLME0005.JPG" class="glow-logo"></span>
  <span><img src="NVLME0005.JPG" class="glow-logo"></span>
  <span><img src="NVLME0005.JPG" class="glow-logo"></span>
  <span><img src="NVLME0005.JPG" class="glow-logo"></span>
</div>

<style>
.glow-logo {
  width:160px;
  animation: glowPulse 3s ease-in-out infinite;
}

@keyframes glowPulse {
  0%{filter:drop-shadow(0 0 4px rgba(0,150,255,0.4));}
  50%{filter:drop-shadow(0 0 15px rgba(0,150,255,0.9));}
  100%{filter:drop-shadow(0 0 4px rgba(0,150,255,0.4));}
}
</style>

<!-- ✅ ADDED WORKING SCRIPT -->
<script>
const demoUser = {
  username: "admin",
  password: "1234"
};

document.querySelector("#signin-tab form").addEventListener("submit", function(e) {
  e.preventDefault();

  const username = this.querySelector("input[type='text']").value;
  const password = this.querySelector("input[type='password']").value;

  if (username === demoUser.username && password === demoUser.password) {
    alert("Login successful! Welcome " + username);
    localStorage.setItem("loggedInUser", username);
  } else {
    alert("Invalid username or password");
  }
});

document.querySelector("#feedback-tab form").addEventListener("submit", function(e) {
  e.preventDefault();

  const name = this.querySelector("input[type='text']").value;
  const email = this.querySelector("input[type='email']").value;
  const message = this.querySelector("textarea").value;

  if (!name || !email || !message) {
    alert("Please fill in all fields");
    return;
  }

  const feedback = JSON.parse(localStorage.getItem("feedbackList") || "[]");

  feedback.push({ name, email, message, date: new Date().toLocaleString() });

  localStorage.setItem("feedbackList", JSON.stringify(feedback));

  alert("Feedback submitted successfully!");
  this.reset();
});
</script>

</html>
