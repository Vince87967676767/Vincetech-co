<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif;}

/* Page background: soft pink, blue, and white gradient */
body{
  background: linear-gradient(135deg, #ffe4e6, #dbeafe, #ffffff);
  padding:40px;
}

/* Grid container */
.icon-wrapper{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

/* Glass-style card */
.icon-box{
  position: relative;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  border-radius:18px;
  text-align:center;
  text-decoration:none;
  color:#1f2937;
  padding:30px 20px;
  transition: all 0.4s ease;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  overflow: hidden;
}

/* Continuous animated gradient overlay for card */
.icon-box::before{
  content:'';
  position:absolute;
  top:0; left:0; right:0; bottom:0;
  background: linear-gradient(270deg, #f472b6, #9333ea, #3b82f6, #f43f5e);
  background-size: 600% 600%;
  opacity:0.12;
  border-radius:18px;
  z-index:0;
  animation: gradientShift 6s ease infinite;
}

/* Gradient animation keyframes */
@keyframes gradientShift {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* Icon */
.icon{
  position: relative;
  z-index:1;
  width:65px;
  height:65px;
  margin:0 auto 15px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:26px;
  transition: transform 0.4s ease, filter 0.4s ease;
  /* Continuous gradient color */
  background: linear-gradient(270deg, #f472b6, #9333ea, #3b82f6, #f43f5e);
  background-size: 600% 600%;
  animation: iconGlow 6s ease infinite, iconPulse 2.5s ease-in-out infinite;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: brightness(1);
}

/* Gradient animation keyframes */
@keyframes iconGlow {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* Breathing glow animation */
@keyframes iconPulse {
  0%, 100%{filter: brightness(1);}
  50%{filter: brightness(1.25);}
}

/* Text */
.icon-box h3{
  position: relative;
  z-index:1;
  margin-bottom:6px;
  font-size:18px;
}

.icon-box p{
  position: relative;
  z-index:1;
  font-size:14px;
  color:#4b5563;
}

/* Hover Effects */
.icon-box:hover{
  transform: translateY(-8px);
  box-shadow: 0 18px 35px rgba(0,0,0,0.08);
  background: rgba(255,255,255,0.8);
}

.icon-box:hover .icon{
  transform: scale(1.25) rotate(8deg);
  filter: brightness(1.5); /* intensify glow on hover */
}

</style>
</head>

<body>
 
<!-- ICON GRID -->

<!-- Ultimate Floating Form -->
<div class="myform-container">

  <!-- Theme Toggle Checkbox -->
  <input type="checkbox" id="theme-toggle">
  <label for="theme-toggle" class="theme-switch">
    <span class="icon">🌙</span>
  </label>

  <!-- Radio buttons for tabs -->
  <input type="radio" name="myform-tab" id="signin" checked>
  <input type="radio" name="myform-tab" id="feedback">

  <!-- Tab headers -->
  <div class="tab-header">
    <label for="signin">Sign In</label>
    <label for="feedback">Feedback</label>
  </div>

  <!-- Tab content -->
  <div class="tab-content">
    <!-- Sign-In Form -->
    <div class="tab" id="signin-tab">
      <form>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
        <div class="link"><a href="#">Forgot Password?</a></div>
      </form>
    </div>

    <!-- Feedback Form -->
<div class="tab" id="feedback-tab">
  <form onsubmit="event.preventDefault(); send();">

    <input id="name" type="text" placeholder="Your Name" required>

    <input id="email" type="email" placeholder="Email Address" required>

    <textarea id="message" placeholder="Your Feedback" required></textarea>

    <button type="submit">Submit Feedback</button> 
    <div id="popup" class="popup">Submitted ✓</div>

    <p id="status" style="margin-top:10px;font-weight:bold;text-align:center;"></p>

  </form>
</div>
   
 <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7PRz9K6IMr3foH5xsaVwmRTFJUlpv1Sg",
  authDomain: "vinctec-admin.firebaseapp.com",
  databaseURL: "https://vinctec-admin-default-rtdb.firebaseio.com",
  projectId: "vinctec-admin",
  storageBucket: "vinctec-admin.firebasestorage.app",
  messagingSenderId: "714000687361",
  appId: "1:714000687361:web:db2cc5745df0cb91b9bb00"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.send = async function () {

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const message = document.getElementById("message").value;
  const status = document.getElementById("status");

  if (!name || !email || !message) {
    status.innerHTML = "❌ Please fill in all fields.";
    status.style.color = "red";
    return;
  }

  try {
    await push(ref(db, "feedback"), {
      name,
      email,
      message,
      time: Date.now()
    });

    status.innerHTML = "✅ Feedback submitted successfully!";
    status.style.color = "#00b050";

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("message").value = "";

  } catch (error) {
    status.innerHTML = "❌ " + error.message;
    status.style.color = "red";
  }

};
</script>

/* positions */
.watermark-layer span:nth-child(1) { top: 10%; left: 5%; }
.watermark-layer span:nth-child(2) { top: 50%; left: 30%; }
.watermark-layer span:nth-child(3) { top: 70%; left: 60%; }
.watermark-layer span:nth-child(4) { top: 20%; left: 80%; }

/* watermark image (IMPORTANT FIX) */
.watermark-layer img {
  width: 60px;   /* prevents blocking UI */
  opacity: 0.1;

}

/* animations disabled safety */
@media (prefers-reduced-motion: reduce) {

}
