<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinctec AI Design Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#0b1424;--panel:#1d2939;--panel2:#111c2d;--line:#334155;--text:#f8fafc;--muted:#a9bad1;--blue:#2563eb;--cyan:#0ea5e9;--gold:#e2a000;--green:#10a84b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.shell{max-width:1320px;margin:0 auto;padding:18px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.title{font-size:24px;font-weight:900}.title span{color:#38bdf8}.back{color:#fff;background:#243247;padding:10px 15px;border-radius:9px;text-decoration:none;font-weight:700}
.panel{background:var(--panel);border:1px solid #24354d;border-radius:14px;padding:18px;margin-bottom:16px}.panel h2{margin:0 0 14px;font-size:18px}.settings-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field{display:block;color:var(--muted);font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;margin-top:6px;padding:12px;border:1px solid #42536a;border-radius:10px;background:#f8fafc;color:#111827;font:inherit}.field textarea{min-height:88px;resize:vertical}.field.wide{grid-column:span 2}.field.full{grid-column:1/-1}
.layout-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.layout-card{border:1px solid #465974;background:#132033;color:#dbeafe;border-radius:10px;padding:10px;cursor:pointer;text-align:left}.layout-card.active{outline:2px solid #38bdf8;background:#18304a}.layout-card strong{display:block;font-size:12px}.layout-card small{color:#91a4bf}.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.swatch{width:36px;height:36px;border-radius:9px;border:2px solid transparent;cursor:pointer}.swatch.active{border-color:#fff;box-shadow:0 0 0 2px #38bdf8}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}.btn{border:0;border-radius:9px;padding:11px 16px;color:#fff;font-size:16px;cursor:pointer}.blue{background:var(--blue)}.cyan{background:var(--cyan)}.gold{background:var(--gold)}.green{background:var(--green)}.dark{background:#334155}.btn:disabled{opacity:.45;cursor:not-allowed}.hint{margin:10px 0;color:var(--muted)}
.preview-wrap{background:var(--panel);border:1px solid #24354d;border-radius:14px;padding:18px}.preview-window{height:690px;border-radius:15px;background:#e5e7eb;padding:14px;overflow:auto}.preview-window iframe{display:block;width:100%;height:100%;border:0;border-radius:12px;background:white;margin:0 auto;transition:width .2s ease}.preview-window.tablet iframe{width:820px;max-width:100%}.preview-window.mobile iframe{width:390px;max-width:100%}.status{font-size:13px;color:#86efac;margin-left:auto}
@media(max-width:1050px){.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.shell{padding:10px}.topbar{align-items:flex-start}.settings-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.layout-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.btn{font-size:14px;padding:10px 12px}.preview-window{height:610px;padding:8px}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><div class="title">VINCTEC <span>AI DESIGN STUDIO</span></div><span class="status" id="status">Ready</span><a class="back" href="admin.html">← Back to Admin</a></div>

  <section class="panel">
    <h2>Website details and premium design controls</h2>
    <div class="settings-grid">
      <label class="field">Business name<input id="business" value="Lumera Skin"></label>
      <label class="field">Business type<select id="industry"><option value="skincare">Skincare / Cosmetics</option><option value="fashion">Clothing / Fashion Brand</option><option value="roofing">Roofing Company</option><option value="restaurant">Restaurant / Café</option><option value="law">Law Firm</option><option value="property">Estate Agent / Property</option><option value="technology">Technology / SaaS</option><option value="fitness">Gym / Fitness</option><option value="health">Healthcare / Clinic</option><option value="beauty">Beauty / Salon</option><option value="construction">Construction / Trades</option><option value="creative">Creative Agency</option><option value="general">Other Premium Business</option></select></label>
      <label class="field">Typography<select id="font"><option value="luxury">Luxury Serif</option><option value="modern">Modern Sans</option><option value="editorial">Editorial</option><option value="fashion">Fashion</option><option value="corporate">Corporate</option></select></label>
      <label class="field">Animation<select id="motion"><option value="luxury">Luxury</option><option value="smooth">Smooth</option><option value="minimal">Minimal</option><option value="none">None</option></select></label>
      <label class="field wide">Description<textarea id="description">Science-led skincare crafted to reveal calm, luminous and healthy-looking skin.</textarea></label>
      <label class="field wide">Services or products<textarea id="services">Skin Consultation, Renewal Serum, Daily Ritual</textarea></label>
      <label class="field">Effect<select id="effect"><option value="soft">Soft Luxury</option><option value="glass">Glass</option><option value="minimal">Minimal</option><option value="gradient">Gradient</option><option value="shadow">Deep Shadows</option></select></label>
      <label class="field">Navigation<select id="nav"><option value="floating">Floating</option><option value="standard">Standard</option><option value="minimal">Minimal</option></select></label>
      <label class="field">Accent colour<input id="accent" type="color" value="#d9a6b2"></label>
      <label class="field">Background colour<input id="background" type="color" value="#fff8f5"></label>
      <div class="field full"><span>Theme presets</span><div class="swatches" id="swatches"></div></div>
      <div class="field full"><span>Website layout</span><div class="layout-grid" id="layouts"></div></div>
    </div>
  </section>

  <section class="panel">
    <div class="actions">
      <button class="btn blue" id="generate">Generate Full Website Files</button>
      <button class="btn gold" id="livePreview">Live Preview</button>
      <button class="btn gold" id="copyPackage">Copy Website Package</button>
    </div>
    <div class="actions">
      <button class="btn cyan" data-download-page="index">Download index.html</button>
      <button class="btn cyan" data-download-page="about">Download about.html</button>
      <button class="btn cyan" data-download-page="services">Download services.html</button>
      <button class="btn cyan" data-download-page="contact">Download contact.html</button>
      <button class="btn cyan" id="downloadCss">Download style.css</button>
    </div>
    <div class="actions"><button class="btn green" id="downloadZip">Download Website ZIP</button></div>
    <div class="actions">
      <button class="btn gold" data-regen="index">Regenerate Hero</button>
      <button class="btn gold" data-regen="about">Regenerate About</button>
      <button class="btn gold" data-regen="services">Regenerate Services</button>
      <button class="btn gold" data-regen="contact">Regenerate Contact</button>
    </div>
    <p class="hint">Preview and download work after you generate the website files.</p>
    <div class="actions">
      <button class="btn blue" data-preview="index">Preview Home</button>
      <button class="btn blue" data-preview="about">Preview About</button>
      <button class="btn blue" data-preview="services">Preview Services</button>
      <button class="btn blue" data-preview="contact">Preview Contact</button>
    </div>
    <div class="actions">
      <button class="btn blue" data-device="desktop">Desktop</button>
      <button class="btn gold" data-device="tablet">Tablet</button>
      <button class="btn green" data-device="mobile">Mobile</button>
    </div>
  </section>

  <section class="preview-wrap"><div class="preview-window" id="previewWindow"><iframe id="preview" title="Website preview"></iframe></div></section>
</div>
<script>
const $=id=>document.getElementById(id);let chosenLayout='signature',theme='blush',currentPage='index',generated=false;let pageOverrides={};
const layouts=[
['signature','Vinctec Signature','Asymmetric luxury'],['signature-dark','Signature Noir','Dark editorial'],['signature-soft','Signature Soft','Airy premium'],
['glass','Glass Atelier','Layered glass'],['glass-orbit','Glass Orbit','Floating panels'],['glass-minimal','Glass Minimal','Clean translucency'],
['editorial','Editorial Luxe','Magazine storytelling'],['editorial-grid','Editorial Grid','Structured magazine'],['editorial-serif','Editorial Serif','High-fashion journal'],
['bento','Bento Prestige','Modular grid'],['bento-wide','Bento Wide','Horizontal modules'],['bento-stack','Bento Stack','Vertical card story'],
['commerce','Luxury Commerce','Product-led'],['commerce-gallery','Commerce Gallery','Collection showcase'],['commerce-split','Commerce Split','Shop storytelling'],
['campaign','Fashion Campaign','Bold editorial'],['campaign-poster','Campaign Poster','Poster-led hero'],['campaign-runway','Campaign Runway','Full-screen statement'],
['conversion','Conversion Luxe','Lead generation'],['conversion-proof','Conversion Proof','Trust-led sales'],['conversion-fast','Conversion Fast','Direct-response layout'],
['executive','Executive Elite','Professional trust'],['executive-board','Executive Boardroom','Corporate authority'],['executive-modern','Executive Modern','Clean consultancy'],
['cinematic','Cinematic Showcase','Immersive media'],['cinematic-frame','Cinematic Frame','Framed storytelling'],['cinematic-scroll','Cinematic Scroll','Long-form reveal'],
['minimal','Quiet Luxury','Elegant simplicity'],['minimal-gallery','Minimal Gallery','Whitespace showcase'],['minimal-type','Type First','Typography-led'],
['showcase','Portfolio Gallery','Visual showcase'],['showcase-mosaic','Portfolio Mosaic','Mixed gallery'],['showcase-case','Case Study Studio','Project-led narrative'],
['split','Split Screen','Strong two-column'],['split-reverse','Split Reverse','Visual-first split'],['split-sticky','Sticky Split','Pinned story layout']
];
const layoutFamilies={signature:'signature','signature-dark':'signature','signature-soft':'signature',glass:'glass','glass-orbit':'glass','glass-minimal':'glass',editorial:'editorial','editorial-grid':'editorial','editorial-serif':'editorial',bento:'bento','bento-wide':'bento','bento-stack':'bento',commerce:'commerce','commerce-gallery':'commerce','commerce-split':'commerce',campaign:'campaign','campaign-poster':'campaign','campaign-runway':'campaign',conversion:'conversion','conversion-proof':'conversion','conversion-fast':'conversion',executive:'executive','executive-board':'executive','executive-modern':'executive',cinematic:'cinematic','cinematic-frame':'cinematic','cinematic-scroll':'cinematic',minimal:'minimal','minimal-gallery':'minimal','minimal-type':'minimal',showcase:'showcase','showcase-mosaic':'showcase','showcase-case':'showcase',split:'split','split-reverse':'split','split-sticky':'split'};
const themes={blush:['#fff8f5','#2b1e22','#d9a6b2','#ffffff'],obsidian:['#08080a','#fafafa','#d4af67','#151519'],ivory:['#f5efe5','#251f18','#9e7652','#fffaf2'],ocean:['#071b25','#effcff','#47c8df','#0f2c39'],emerald:['#07150f','#effcf3','#77c694','#10251a'],royal:['#110a1c','#fbf7ff','#b78cff','#211331'],stone:['#161715','#faf6ed','#d2a85f','#252621'],azure:['#edf6ff','#10243e','#3077e2','#ffffff'],ruby:['#210a0f','#fff5f6','#f15f76','#35131b'],mono:['#080808','#ffffff','#ffffff','#161616']};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function slug(s){return String(s||'vinctec-site').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'vinctec-site'}
function industryCopy(ind){return ({skincare:['Radiance, refined.','A considered ritual for skin that deserves more.','Shop the ritual','Ingredient intelligence'],fashion:['Designed to be remembered.','A new expression of modern style, made for movement and identity.','Explore the collection','New season'],roofing:['Protection built to last.','Trusted roofing, repairs and inspections delivered with precision.','Request a free quote','Reliable workmanship'],restaurant:['An experience worth returning to.','Seasonal flavour, considered hospitality and a setting made for moments.','Reserve a table','Our menu'],law:['Clarity when it matters most.','Strategic legal guidance delivered with discretion and confidence.','Book a consultation','Practice areas'],property:['Property, presented properly.','Premium marketing and trusted guidance for important moves.','View properties','Local expertise'],technology:['Build what comes next.','Digital products and systems engineered for ambitious organisations.','Start a project','Capabilities'],fitness:['Stronger starts here.','Coaching, community and performance built around your goals.','Join today','Training'],health:['Care with confidence.','Modern, compassionate care centred on your wellbeing.','Book an appointment','Our care'],beauty:['Your best look, elevated.','Personal beauty experiences shaped with skill and attention.','Book now','Treatments'],construction:['Built with purpose.','Reliable construction and trade services delivered to a higher standard.','Request a quote','Our services'],creative:['Ideas with impact.','Strategy, design and content created to move brands forward.','View our work','Selected projects'],general:['Made to stand apart.','Premium service, thoughtful details and an experience clients remember.','Start a project','What we do']})[ind]||['Made to stand apart.','Premium service, thoughtful details and an experience clients remember.','Start a project','What we do']}
function config(){const t=themes[theme]||themes.blush;return{business:esc($('business').value||'Your Business'),industry:$('industry').value,desc:esc($('description').value||''),services:$('services').value.split(',').map(x=>esc(x.trim())).filter(Boolean),layout:chosenLayout,font:$('font').value,effect:$('effect').value,motion:$('motion').value,nav:$('nav').value,accent:$('accent').value,bg:$('background').value,t,copy:industryCopy($('industry').value)}}
function renderLayouts(){const box=$('layouts');box.innerHTML='';layouts.forEach(l=>{const b=document.createElement('button');b.className='layout-card'+(l[0]===chosenLayout?' active':'');b.innerHTML=`<strong>${l[1]}</strong><small>${l[2]}</small>`;b.onclick=()=>{chosenLayout=l[0];renderLayouts();autoPreview()};box.appendChild(b)})}
function renderThemes(){const box=$('swatches');box.innerHTML='';Object.entries(themes).forEach(([k,v])=>{const b=document.createElement('button');b.className='swatch'+(k===theme?' active':'');b.style.background=`linear-gradient(135deg,${v[0]} 50%,${v[2]} 50%)`;b.title=k;b.onclick=()=>{theme=k;$('background').value=v[0];$('accent').value=v[2];renderThemes();autoPreview()};box.appendChild(b)})}
function navHtml(c){return `<header class="${c.nav}"><a class="logo" href="index.html">${c.business}</a><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="services.html">Services</a><a href="contact.html">Contact</a></nav><a class="primary" href="contact.html">Start a project</a></header>`}
function serviceCards(c){const arr=c.services.length?c.services:['Signature Service','Premium Experience','Client Support'];return `<div class="cards">${arr.slice(0,6).map((x,i)=>`<article><b>0${i+1}</b><h3>${x}</h3><p>Thoughtfully delivered around your goals, quality and long-term value.</p></article>`).join('')}</div>`}
function special(c){if(c.industry==='skincare')return `<section class="special"><p class="eyebrow">THE RITUAL</p><h2>Skincare with intention.</h2><div class="cards"><article><h3>Restore</h3><p>Cleanse and reset without stripping the skin.</p></article><article><h3>Treat</h3><p>Targeted actives chosen for visible, balanced results.</p></article><article><h3>Protect</h3><p>Daily hydration and defence that supports the barrier.</p></article></div></section>`;if(c.industry==='fashion')return `<section class="campaign"><div class="campaign-art"></div><div><p class="eyebrow">NEW COLLECTION</p><h2>Identity in every detail.</h2><p>Designed for people who do not need permission to stand out.</p></div></section>`;if(c.industry==='roofing')return `<section class="special"><p class="eyebrow">ROOFING EXPERTISE</p><h2>Repairs, replacements and inspections.</h2><div class="cards"><article><h3>Roof Repairs</h3><p>Fast diagnosis and durable repair work.</p></article><article><h3>New Roofs</h3><p>Complete installations with clear project management.</p></article><article><h3>Emergency Call-outs</h3><p>Responsive help when weather or damage cannot wait.</p></article></div></section>`;return ''}
function pageBody(page,c){
 const o=pageOverrides[page],family=layoutFamilies[c.layout]||'signature';
 if(page==='about')return `<main><section class="page-hero"><p class="eyebrow">ABOUT ${c.business.toUpperCase()}</p><h1>${o||'The standard behind the experience.'}</h1><p class="lead">${c.desc}</p></section><section class="story"><p class="eyebrow">OUR APPROACH</p><div><h2>Purpose in every detail.</h2><p>We combine expertise, thoughtful service and a premium approach to create results people trust and remember.</p></div></section><section class="values">${serviceCards(c)}</section></main>`;
 if(page==='services')return `<main><section class="page-hero"><p class="eyebrow">SERVICES</p><h1>${o||c.copy[3]}</h1><p class="lead">Clear solutions, premium delivery and support centred around the client.</p></section><section class="services">${serviceCards(c)}</section>${special(c)}</main>`;
 if(page==='contact')return `<main><section class="page-hero"><p class="eyebrow">CONTACT</p><h1>${o||'Let’s create something exceptional.'}</h1><p class="lead">Tell us about what you need and we’ll help shape the right next step.</p></section><section class="contact-grid"><div><h2>Start the conversation.</h2><p>Email: hello@example.com</p><p>Phone: +44 0000 000000</p></div><form onsubmit="event.preventDefault();alert('Thank you. Your enquiry has been received.')"><label>Name<input required></label><label>Email<input type="email" required></label><label>Message<textarea required></textarea></label><button class="primary">Send enquiry</button></form></section></main>`;
 const hero=`<div class="hero-copy"><p class="eyebrow">${c.copy[3]}</p><h1>${o||c.copy[0]}</h1><p class="lead">${c.copy[1]}</p><div class="actions"><a class="primary" href="services.html">${c.copy[2]}</a><a href="about.html">Discover our story →</a></div></div><div class="hero-visual"><span>${c.business.charAt(0)}</span></div>`;
 const trust=`<section class="trust"><span>PREMIUM QUALITY</span><span>PERSONAL SERVICE</span><span>BUILT TO LAST</span></section>`;
 const story=`<section class="story"><p class="eyebrow">OUR STORY</p><div><h2>Designed around the client.</h2><p>${c.desc}</p></div></section>`;
 const services=`<section class="services"><p class="eyebrow">${c.copy[3]}</p><h2>Made around what matters.</h2>${serviceCards(c)}</section>`;
 const quote=`<section class="testimonial"><blockquote>“The entire experience felt considered, personal and genuinely premium.”</blockquote><p>— Client experience</p></section>`;
 const cta=`<section class="contact"><p class="eyebrow">START A CONVERSATION</p><h2>Ready to create something exceptional?</h2><a class="primary" href="contact.html">Get in touch</a></section>`;
 const patterns={
 signature:`<section class="hero">${hero}</section>${trust}${story}${services}${special(c)}${quote}${cta}`,
 glass:`<section class="hero glass-stage">${hero}</section><section class="glass-band">${services}</section>${story}${special(c)}${quote}${cta}`,
 editorial:`<section class="editorial-cover"><p class="eyebrow">${c.copy[3]}</p><h1>${o||c.copy[0]}</h1><p class="lead">${c.copy[1]}</p></section><section class="hero editorial-media">${hero}</section>${story}${services}${special(c)}${quote}${cta}`,
 bento:`<section class="bento-hero"><div class="bento-lead">${hero}</div><div class="bento-mini">${trust}</div></section>${services}${story}${special(c)}${cta}`,
 commerce:`<section class="hero commerce-hero">${hero}</section><section class="collection-strip"><span>NEW</span><span>ESSENTIAL</span><span>SIGNATURE</span></section>${special(c)}${services}${quote}${cta}`,
 campaign:`<section class="campaign-cover"><div>${hero}</div></section><section class="campaign-marquee">NEW SEASON · SIGNATURE STORY · LIMITED EDITION</section>${special(c)}${story}${services}${cta}`,
 conversion:`<section class="hero conversion-hero">${hero}<aside class="lead-card"><b>Free consultation</b><p>Tell us what you need and receive a clear next step.</p><a class="primary" href="contact.html">Get started</a></aside></section>${trust}${services}${quote}${cta}`,
 executive:`<section class="executive-hero">${hero}</section>${trust}<section class="executive-grid">${story}${services}</section>${quote}${cta}`,
 cinematic:`<section class="cinematic-hero">${hero}</section><section class="cinematic-caption"><p class="eyebrow">THE EXPERIENCE</p><h2>Made to hold attention.</h2></section>${story}${services}${special(c)}${cta}`,
 minimal:`<section class="minimal-hero">${hero}</section>${story}${services}${quote}${cta}`,
 showcase:`<section class="showcase-hero">${hero}</section><section class="mosaic"><i></i><i></i><i></i><i></i></section>${story}${services}${special(c)}${cta}`,
 split:`<section class="hero split-home">${hero}</section><section class="split-content">${story}${services}</section>${special(c)}${quote}${cta}`
 };
 return `<main>${patterns[family]||patterns.signature}</main>`;
}
function css(c){return `:root{--bg:${c.bg};--text:${c.t[1]};--accent:${c.accent};--surface:${c.t[3]}}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:${c.font==='luxury'?"Georgia,'Times New Roman',serif":c.font==='editorial'?"'Arial Narrow',Arial,sans-serif":c.font==='fashion'?"Helvetica,Arial,sans-serif":"Inter,Arial,sans-serif"};line-height:1.6}a{color:inherit;text-decoration:none}header{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:24px 5vw}header.floating{position:sticky;top:16px;margin:0 3vw;border:1px solid color-mix(in srgb,var(--text) 16%,transparent);border-radius:999px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(20px);padding:14px 22px}header.minimal{padding-top:35px}.logo{font-weight:900;letter-spacing:.08em}nav{display:flex;gap:24px;font-size:14px}.hero,.page-hero{min-height:78vh;padding:8vw 7vw;display:grid;grid-template-columns:1.15fr .85fr;gap:5vw;align-items:center}.page-hero{display:block;min-height:auto;padding-top:12vw;padding-bottom:7vw}.eyebrow{font-size:12px;letter-spacing:.22em;font-weight:800;color:var(--accent)}h1{font-size:clamp(56px,8vw,126px);line-height:.88;letter-spacing:-.055em;margin:18px 0}h2{font-size:clamp(36px,5vw,72px);line-height:1;margin:12px 0 24px}.lead{max-width:720px;font-size:18px;opacity:.72}.actions{display:flex;gap:22px;align-items:center;margin-top:30px}.primary{display:inline-block;padding:14px 24px;border:0;border-radius:999px;background:var(--accent);color:#111;font-weight:800;cursor:pointer}.hero-visual{aspect-ratio:4/5;border-radius:${c.effect==='minimal'?'0':'32px'};display:grid;place-items:center;background:${c.effect==='gradient'?'linear-gradient(145deg,var(--accent),var(--surface))':'var(--surface)'};box-shadow:${c.effect==='shadow'?'0 40px 100px rgba(0,0,0,.35)':'none'};border:${c.effect==='glass'?'1px solid color-mix(in srgb,var(--text) 18%,transparent)':'0'};overflow:hidden}.hero-visual span{font-size:25vw;opacity:.12;font-weight:900}.trust{display:flex;justify-content:space-around;gap:20px;padding:20px;border-block:1px solid color-mix(in srgb,var(--text) 16%,transparent);font-size:12px;letter-spacing:.18em}.story,.services,.special,.contact,.campaign,.values,.contact-grid{padding:9vw 7vw}.story{display:grid;grid-template-columns:.6fr 1.4fr;gap:5vw}.story p:last-child{font-size:21px;max-width:730px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cards article{padding:30px;background:var(--surface);border-radius:${c.effect==='minimal'?'0':'24px'};border:1px solid color-mix(in srgb,var(--text) 10%,transparent);${c.effect==='glass'?'backdrop-filter:blur(18px);background:color-mix(in srgb,var(--surface) 70%,transparent);':''}}.cards b{color:var(--accent)}.campaign{display:grid;grid-template-columns:1fr 1fr;gap:30px}.campaign-art{min-height:480px;background:linear-gradient(135deg,var(--surface),var(--accent));border-radius:30px}.testimonial{padding:10vw 12vw;text-align:center}.testimonial blockquote{font-size:clamp(30px,5vw,68px);line-height:1.1;margin:0}.contact{text-align:center}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:6vw}.contact-grid form{display:grid;gap:15px;padding:30px;background:var(--surface);border-radius:24px}.contact-grid input,.contact-grid textarea{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid color-mix(in srgb,var(--text) 18%,transparent);background:var(--bg);color:var(--text);border-radius:10px}.contact-grid textarea{min-height:150px}footer{display:flex;justify-content:space-between;padding:30px 5vw;border-top:1px solid color-mix(in srgb,var(--text) 14%,transparent)}.layout-editorial .hero{grid-template-columns:1fr}.layout-editorial .hero-visual{height:55vh;aspect-ratio:auto}.layout-bento .services .cards{grid-template-columns:2fr 1fr}.layout-commerce .hero{grid-template-columns:.8fr 1.2fr}.layout-campaign h1{text-transform:uppercase}.layout-conversion .hero{background:var(--surface)}.layout-executive h1{font-size:clamp(52px,6vw,92px)}.layout-cinematic .hero{min-height:90vh}.layout-minimal .hero-visual{background:transparent;border:1px solid color-mix(in srgb,var(--text) 16%,transparent)}.layout-showcase .hero{grid-template-columns:1fr 1.3fr}.layout-split .hero{padding:0;gap:0;min-height:85vh}.layout-split .hero-copy{padding:8vw}.layout-split .hero-visual{border-radius:0;height:85vh;aspect-ratio:auto}.editorial-cover{padding:8vw 7vw 4vw}.editorial-cover h1{max-width:1100px}.editorial-media{min-height:55vh}.bento-hero{padding:5vw 7vw;display:grid;grid-template-columns:2fr 1fr;gap:18px}.bento-lead{background:var(--surface);border-radius:32px;overflow:hidden}.bento-mini{display:grid;align-items:end}.glass-band{margin:0 4vw;border-radius:40px;background:color-mix(in srgb,var(--surface) 65%,transparent);backdrop-filter:blur(22px)}.collection-strip,.campaign-marquee{display:flex;justify-content:space-around;padding:18px;border-block:1px solid color-mix(in srgb,var(--text) 15%,transparent);letter-spacing:.18em;font-size:12px}.lead-card{padding:28px;background:var(--surface);border-radius:24px;align-self:center}.conversion-hero{grid-template-columns:1fr .65fr .55fr}.executive-hero{padding-bottom:3vw}.executive-grid{display:grid;grid-template-columns:1fr 1fr}.cinematic-hero{min-height:92vh;background:linear-gradient(145deg,var(--surface),var(--bg))}.cinematic-caption{padding:4vw 7vw}.minimal-hero{padding-top:14vw}.showcase-hero{min-height:62vh}.mosaic{padding:2vw 7vw 9vw;display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:240px 240px;gap:14px}.mosaic i{display:block;background:linear-gradient(135deg,var(--surface),var(--accent));border-radius:24px}.mosaic i:first-child{grid-row:1/3}.mosaic i:last-child{grid-column:2/4}.split-content{display:grid;grid-template-columns:1fr 1fr}.layout-signature-dark .hero{background:var(--surface)}.layout-signature-soft .hero{padding-inline:11vw}.layout-glass-orbit .hero-visual{border-radius:50%;transform:rotate(-5deg)}.layout-glass-minimal .glass-band{background:transparent;border:1px solid color-mix(in srgb,var(--text) 15%,transparent)}.layout-editorial-grid .editorial-cover{display:grid;grid-template-columns:.35fr 1fr;align-items:end}.layout-editorial-serif h1{font-family:Georgia,serif;font-style:italic}.layout-bento-wide .bento-hero{grid-template-columns:3fr 1fr}.layout-bento-stack .bento-hero{grid-template-columns:1fr}.layout-commerce-gallery .hero-visual{aspect-ratio:1/1}.layout-commerce-split .commerce-hero{padding:0}.layout-campaign-poster .campaign-cover h1{text-transform:uppercase;font-size:clamp(72px,12vw,180px)}.layout-campaign-runway .campaign-cover{min-height:95vh;display:grid;align-items:end}.layout-conversion-proof .trust{background:var(--surface)}.layout-conversion-fast .conversion-hero{min-height:62vh}.layout-executive-board .executive-hero{border-bottom:6px solid var(--accent)}.layout-executive-modern .executive-grid{gap:20px}.layout-cinematic-frame .cinematic-hero{margin:2vw;border-radius:30px;overflow:hidden}.layout-cinematic-scroll .cinematic-hero{min-height:110vh}.layout-minimal-gallery .hero-visual{background:linear-gradient(180deg,transparent,var(--surface))}.layout-minimal-type .hero-visual{display:none}.layout-minimal-type .minimal-hero{grid-template-columns:1fr}.layout-showcase-mosaic .mosaic{grid-template-columns:1fr 1fr 1fr}.layout-showcase-case .mosaic i{border-radius:0}.layout-split-reverse .split-home .hero-copy{order:2}.layout-split-sticky .split-home .hero-copy{position:sticky;top:100px;align-self:start}${c.motion==='none'?'*{animation:none!important;transition:none!important}':c.motion==='minimal'?'.hero-copy,.page-hero{animation:fade .7s ease both}':'section{animation:fadeUp .9s ease both}.hero-visual{animation:scaleIn 1.1s ease both}@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}'}@keyframes fade{from{opacity:0}to{opacity:1}}@media(max-width:800px){header nav{display:none}.hero,.story,.campaign,.contact-grid{grid-template-columns:1fr}.hero{padding-top:18vw}.cards{grid-template-columns:1fr}.layout-bento .services .cards{grid-template-columns:1fr}.layout-split .hero{display:block}.bento-hero,.executive-grid,.split-content{grid-template-columns:1fr}.conversion-hero{grid-template-columns:1fr}.mosaic{grid-template-columns:1fr;grid-template-rows:auto}.mosaic i{min-height:220px}.mosaic i:first-child,.mosaic i:last-child{grid-row:auto;grid-column:auto}.layout-split .hero-visual{height:55vh}h1{font-size:54px}footer{gap:20px;flex-direction:column}}`}
function fullHtml(page){const c=config(),title=page==='index'?c.business:`${page[0].toUpperCase()+page.slice(1)} | ${c.business}`;return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="${c.desc}"><title>${title}</title><link rel="stylesheet" href="style.css"></head><body class="layout-${c.layout}">${navHtml(c)}${pageBody(page,c)}<footer><strong>${c.business}</strong><span>© ${new Date().getFullYear()} · Built with Vinctec</span></footer></body></html>`}
function previewHtml(page){
  const c=config();
  let h=fullHtml(page).replace('<link rel="stylesheet" href="style.css">',`<style>${css(c)}</style>`);
  const previewBridge=`<script>(function(){document.addEventListener('click',function(event){const link=event.target.closest('a[href]');if(!link)return;const href=(link.getAttribute('href')||'').split('#')[0];const pages={'index.html':'index','about.html':'about','services.html':'services','contact.html':'contact'};if(pages[href]){event.preventDefault();parent.postMessage({type:'vinctec-preview-page',page:pages[href]},'*');}});})();<\/script>`;
  return h.replace('</body>',previewBridge+'</body>');
} 
function markPreviewButton(){document.querySelectorAll('[data-preview]').forEach(b=>b.classList.toggle('active',b.dataset.preview===currentPage))}
function showPreview(page,label){currentPage=page;$('preview').srcdoc=previewHtml(page);markPreviewButton();setStatus(label||('Previewing '+(page==='index'?'home':page)))}
function setStatus(t){$('status').textContent=t}
function generate(){generated=true;pageOverrides={};showPreview('index','Full website generated')}
function autoPreview(){if(generated){showPreview(currentPage,'Preview updated')}}
function download(name,content,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),600)}
function ensure(){if(!generated){alert('Generate the full website files first.');return false}return true}
$('generate').onclick=generate;$('livePreview').onclick=()=>{if(!generated)generate();else showPreview(currentPage,'Live preview refreshed')};
$('copyPackage').onclick=async()=>{if(!ensure())return;const text=['===== index.html =====',fullHtml('index'),'===== about.html =====',fullHtml('about'),'===== services.html =====',fullHtml('services'),'===== contact.html =====',fullHtml('contact'),'===== style.css =====',css(config())].join('\n\n');await navigator.clipboard.writeText(text);setStatus('Website package copied')};
document.querySelectorAll('[data-download-page]').forEach(b=>b.onclick=()=>{if(ensure())download(b.dataset.downloadPage==='index'?'index.html':b.dataset.downloadPage+'.html',fullHtml(b.dataset.downloadPage),'text/html')});
$('downloadCss').onclick=()=>{if(ensure())download('style.css',css(config()),'text/css')};
$('downloadZip').onclick=async()=>{if(!ensure())return;if(typeof JSZip==='undefined'){alert('ZIP library is still loading.');return}const zip=new JSZip();['index','about','services','contact'].forEach(p=>zip.file(p==='index'?'index.html':p+'.html',fullHtml(p)));zip.file('style.css',css(config()));zip.file('README.txt','Upload all files to the same GitHub repository folder. Open index.html first.');const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=slug($('business').value)+'-website.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),600);setStatus('Website ZIP downloaded')};
document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{if(!ensure())return;showPreview(b.dataset.preview)});
window.addEventListener('message',event=>{if(!generated||!event.data||event.data.type!=='vinctec-preview-page')return;const page=event.data.page;if(['index','about','services','contact'].includes(page))showPreview(page,'Preview switched from website navigation')});
document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{$('previewWindow').className='preview-window '+(b.dataset.device==='desktop'?'':b.dataset.device);setStatus(b.dataset.device+' preview')});
document.querySelectorAll('[data-regen]').forEach(b=>b.onclick=()=>{if(!ensure())return;const page=b.dataset.regen;const choices={index:['Luxury that feels personal.','Made to be remembered.','A new standard for your business.'],about:['The story behind the standard.','Built around trust and detail.','Experience shaped with intention.'],services:['What we do, elevated.','Premium services. Clear results.','Expertise made effortless.'],contact:['Let’s begin something remarkable.','Your next chapter starts here.','Ready when you are.']};const arr=choices[page];pageOverrides[page]=arr[Math.floor(Math.random()*arr.length)];showPreview(page,page+' regenerated')});
['business','industry','description','services','font','motion','effect','nav','accent','background'].forEach(id=>$(id).addEventListener('input',autoPreview));
renderLayouts();renderThemes();generate();
</script>
