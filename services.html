<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vinctec.co.uk</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<style>
* { box-sizing:border-box; margin:0; padding:0; font-family:Arial,sans-serif; }

/* Fullscreen video background */
body, html { height:100%; width:100%; overflow-x:hidden; background:#000; }
body { display:flex; flex-direction:column; align-items:center; padding-top:8vh; }

video#bg-video {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  object-fit:cover;
  z-index:-2;
  filter: brightness(0.4) contrast(1.2);
}

body::after {
  content:'';
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.3);
  z-index:-1;
}

/* Particles */
#particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: rgba(0,255,255,0.55);
  border-radius: 50%;
  animation: float 6s linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh) translateX(0) scale(1); opacity:0.4;}
  50%{opacity:0.7;}
  100%{transform:translateY(-10vh) translateX(50px) scale(0.5); opacity:0;}
}

/* ICON GRID */
.icon-wrapper {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:30px;
  width:90%;
  max-width:1200px;
  margin-bottom:50px;
  position:relative;
  z-index:1;
}

.icon-box {
  position:relative;
  background:rgba(255,255,255,0);
  border-radius:18px;
  text-align:center;
  text-decoration:none;
  color:#fff;
  padding:30px 20px;
  transition: all 0.4s ease;
}

.icon-box::before {
  content:'';
  position:absolute;
  top:-2px; left:-2px; right:-2px; bottom:-2px;
  border-radius:20px;
  border:1px solid rgba(0,255,255,0.25);
  box-shadow:0 0 8px rgba(0,255,255,0.5),
             0 0 16px rgba(0,255,255,0.3),
             0 0 24px rgba(0,255,255,0.2);
  z-index:0;
  animation: neonPulse 3s ease-in-out infinite alternate;
}

@keyframes neonPulse {
  0% { box-shadow:0 0 4px rgba(0,255,255,0.3); }
  100% { box-shadow:0 0 12px rgba(0,255,255,0.7); }
}

.icon {
  position:relative;
  z-index:1;
  width:80px;
  height:80px;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  background:linear-gradient(270deg,#0ff,#0ff,#0ff,#0ff);
  background-size:600% 600%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: iconGlow 6s ease infinite, iconPulse 3s ease-in-out infinite;
}

@keyframes iconGlow {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

@keyframes iconPulse {
  0%,100%{filter:brightness(1);}
  50%{filter:brightness(1.5);}
}

/* Logo */
.logo-section {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-bottom: 40px;
  z-index: 1;
  position: relative;
}

.logo {
  width: 150px;
  max-width: 20vw;
  border-radius: 12px;
}

/* Service */
.service-showcase {
  width:90%;
  max-width:1000px;
  margin-bottom:60px;
  text-align:center;
  color:#fff;
}

/* Gallery */
.image-gallery {
  display:flex;
  justify-content:center;
  gap:60px;
  margin-bottom:60px;
  flex-wrap:wrap;
}

/* Sections */
.section {
  width:90%;
  max-width:1200px;
  margin-bottom:60px;
  text-align:center;
  color:#fff;
}

/* PROJECTS GRID (FIXED LOCATION) */
.projects-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:35px;
  justify-items:center;
  align-items:center;
  margin-top:30px;
}

.featured-project{
  grid-column:span 2;
  width:100%;
  max-width:850px;
  height:450px;
}

.featured-project video{
  width:100%;
  height:100%;
  object-fit:cover;
}

@media(max-width:900px){
  .featured-project{
    grid-column:span 1;
    height:350px;
  }
}

/* PRICING GRID (FIXED LOCATION) */
.pricing-grid{
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
}

.price-card{
  width:320px;
  padding:30px;
  border-radius:20px;
  text-align:center;
  color:white;
  background:rgba(0,255,255,0.05);
  border:1px solid rgba(0,255,255,0.25);
  box-shadow:0 0 15px rgba(0,255,255,0.25),
             0 0 30px rgba(0,255,255,0.15);
}

.price{
  font-size:42px;
  color:#0ff;
  margin:20px 0;
  font-weight:bold;
}

/* CTA */
.cta-btn{
  display:inline-block;
  padding:15px 35px;
  color:#0ff;
  border:2px solid #0ff;
  border-radius:50px;
  text-decoration:none;
}

/* Video background fix */
video#bg-video {
  playsinline: true;
}
</style>
</head>

<body>

<div id="particles"></div>

<!-- ICON GRID -->
<div class="icon-wrapper">
  <a href="index.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-house"></i></div>
    <h3>Home</h3>
    <p>Back to main page</p>
  </a>

  <a href="services.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-laptop-code"></i></div>
    <h3>Services</h3>
    <p>Web design & development</p>
  </a>

  <a href="contact.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-envelope"></i></div>
    <h3>Contact</h3>
    <p>Get in touch</p>
  </a>

  <a href="about.html" class="icon-box">
    <div class="icon"><i class="fa-solid fa-user"></i></div>
    <h3>About</h3>
    <p>Who we are</p>
  </a>
</div>

<!-- LOGO -->
<div class="logo-section">
  <img src="NVLME0005.JPG" class="logo">
</div>

<!-- VIDEO PROJECT -->
<div class="projects-grid">
  <div class="project-card featured-project">
    <video autoplay muted loop playsinline controls>
      <source src="Storyboard 1.mp4" type="video/mp4">
    </video>
  </div>
</div>

<!-- CTA -->
<div class="section">
  <a href="contact.html" class="cta-btn">Get in Touch</a>
</div>

<!-- BACKGROUND VIDEO -->
<video id="bg-video" autoplay muted loop playsinline>
  <source src="background.mp4" type="video/mp4">
</video>

<script>
const particleContainer = document.getElementById('particles');
for (let i = 0; i < 80; i++) {
  const p = document.createElement('div');
  p.classList.add('particle');
  p.style.left = Math.random() * 100 + 'vw';
  p.style.animationDelay = Math.random() * 6 + 's';
  particleContainer.appendChild(p);
}
</script>

</body>
</html>
