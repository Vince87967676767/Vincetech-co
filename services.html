<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vinctec.co.uk</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<style>
* { box-sizing:border-box; margin:0; padding:0; font-family:Arial,sans-serif; }

body, html { height:100%; width:100%; overflow-x:hidden; background:#000; }
body { display:flex; flex-direction:column; align-items:center; padding-top:8vh; }

video#bg-video {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
  filter: brightness(0.4) contrast(1.2);
}

body::after {
  content:'';
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.3);
  z-index:-1;
}

#particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: rgba(0,255,255,0.55);
  border-radius: 50%;
  animation: float 6s linear infinite;
}

@keyframes float{
  0%{transform:translateY(100vh) translateX(0) scale(1); opacity:0.4;}
  50%{opacity:0.7;}
  100%{transform:translateY(-10vh) translateX(50px) scale(0.5); opacity:0;}
}

.icon-wrapper { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:30px; width:90%; max-width:1200px; margin-bottom:50px; position:relative; z-index:1; }

.icon-box { position:relative; background:rgba(255,255,255,0); border-radius:18px; text-align:center; text-decoration:none; color:#fff; padding:30px 20px; }

.icon-box::before {
  content:'';
  position:absolute;
  top:-2px; left:-2px; right:-2px; bottom:-2px;
  border-radius:20px;
  border:1px solid rgba(0,255,255,0.25);
  box-shadow:0 0 8px rgba(0,255,255,0.5);
}

.icon { font-size:34px; color:#0ff; margin-bottom:10px; }

.logo-section {
  width:100%;
  display:flex;
  justify-content:center;
  margin-bottom:40px;
}

.logo { width:150px; }

.image-gallery { display:flex; justify-content:center; gap:60px; flex-wrap:wrap; margin-bottom:60px; }

.image-gallery img {
  width:30vw;
  max-width:400px;
  min-width:250px;
  border-radius:20px;
}

.project-card {
  width:350px;
  height:350px;
  overflow:hidden;
}

.project-card img, .project-card video {
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ONLY CHANGE: mobile video fix */
@media (max-width: 768px) {
  video#bg-video {
    display:block;
  }
}
</style>
</head>

<body>

<div id="particles"></div>

<div class="icon-wrapper">
  <a href="/" class="icon-box">
    <div class="icon"><i class="fa-solid fa-house"></i></div>
    <h3>Home</h3>
  </a>

  <a href="/services/" class="icon-box">
    <div class="icon"><i class="fa-solid fa-laptop-code"></i></div>
    <h3>Services</h3>
  </a>

  <a href="/contact/" class="icon-box">
    <div class="icon"><i class="fa-solid fa-envelope"></i></div>
    <h3>Contact</h3>
  </a>

  <a href="/about/" class="icon-box">
    <div class="icon"><i class="fa-solid fa-user"></i></div>
    <h3>About</h3>
  </a>
</div>

<div class="logo-section">
  <a href="index.html">
    <img src="NVLME0005.JPG" class="logo">
  </a>
</div>

<div class="image-gallery">
  <img src="image1.jpg">
  <img src="image2.jpg">
  <img src="image3.jpg">
</div>

<!-- FIXED VIDEO (ONLY ADDITION) -->
<video id="bg-video"
       autoplay
       muted
       loop
       playsinline
       webkit-playsinline
       preload="auto">
  <source src="background.mp4" type="video/mp4">
</video>

<div class="project-card">
  <video autoplay muted loop playsinline webkit-playsinline>
    <source src="background.mp4" type="video/mp4">
  </video>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const video = document.getElementById("bg-video");
  if (!video) return;

  video.muted = true;

  const playVideo = () => {
    const p = video.play();
    if (p) {
      p.catch(() => {
        document.body.addEventListener("touchstart", () => {
          video.play();
        }, { once: true });
      });
    }
  };

  playVideo();
});

// particles
const particleContainer = document.getElementById('particles');
for (let i = 0; i < 80; i++) {
  const p = document.createElement('div');
  p.classList.add('particle');
  p.style.left = Math.random() * 100 + 'vw';
  p.style.animationDelay = Math.random() * 6 + 's';
  particleContainer.appendChild(p);
}
</script>

</body>
</html>
